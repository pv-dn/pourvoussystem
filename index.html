<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRvXOmLV_iU9ybzJrquJSglUYfEON_CsM",
  authDomain: "pourvoussystem.firebaseapp.com",
  projectId: "pourvoussystem",
  storageBucket: "pourvoussystem.firebasestorage.app",
  messagingSenderId: "505648740877",
  appId: "1:505648740877:web:f5b0c3a950866ce74bb344"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window._db = db;
window._auth = auth;

// ログイン・ログアウト関数
window._signIn = async function(email, password) {
  return await signInWithEmailAndPassword(auth, email, password);
};
window._signOut = async function() {
  return await signOut(auth);
};
window._createUser = async function(email, password) {
  return await createUserWithEmailAndPassword(auth, email, password);
};
window._updateUserPassword = async function(user, newPassword) {
  return await updatePassword(user, newPassword);
};
// 管理者用：別セッションでユーザーを再作成してパスワードを付け直す
window._resetUserPassword = async function(shortId, displayName, newPassword, oldUid) {
  const secondary = initializeApp(firebaseConfig, "pv-reset-" + Date.now());
  try {
    const secondaryAuth = getAuth(secondary);
    const base = String(shortId || "user").toLowerCase().replace(/[^a-z0-9]/g, "") || "user";
    // 既存 ey@pv.local が残っていても再設定できるよう、一意なメールで新規作成する
    const email = base + "_r" + Date.now().toString(36) + "@pv.local";
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, newPassword);
    const newUid = cred.user.uid;
    await setDoc(doc(db, "userProfiles", newUid), {
      email, shortId, displayName: displayName || ""
    }, { merge: true });
    if (oldUid && oldUid !== newUid) {
      try {
        const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
        await deleteDoc(doc(db, "userProfiles", oldUid));
      } catch (_) {}
    }
    await signOut(secondaryAuth);
    return { newUid, email };
  } finally {
    try { await deleteApp(secondary); } catch (_) {}
  }
};

// ログイン履歴を保存
window._saveLoginLog = async function(uid, email, displayName) {
  try {
    await addDoc(collection(db, "loginLogs"), {
      uid, email, displayName: displayName||"",
      loginAt: new Date().toISOString()
    });
  } catch(e) { console.warn("login log error", e); }
};

// ログイン履歴を取得
window._getLoginLogs = async function(n) {
  try {
    const q = query(collection(db, "loginLogs"), orderBy("loginAt","desc"), limit(n||50));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
};

// ユーザー情報をFirestoreに保存（displayName・shortId管理）
window._saveUserProfile = async function(uid, data) {
  await setDoc(doc(db, "userProfiles", uid), data, {merge:true});
};
window._getUserProfiles = async function() {
  try {
    const snap = await getDocs(collection(db, "userProfiles"));
    return snap.docs.map(d => ({uid: d.id, ...d.data()}));
  } catch(e) { return []; }
};


// 認証状態の監視
onAuthStateChanged(auth, (user) => {
  window._currentUser = user;
  if (!user) {
    window._appStarted = false;
    window._booting = false;
    if (typeof window.showLoginScreen === "function") window.showLoginScreen();
  } else if (!window._manualLoginInProgress && typeof window.bootApp === "function") {
    window.bootApp();
  }
});

const FS_KEYS = {
  pv_customers: "customers",
  pv_products: "products",
  pv_prices: "prices",
  pv_history: "history",
  pv_invoice_counters: "invoiceCounters",
  pv_closing_days: "closingDays",
  pv_min: "minG",
  pv_cycles: "cycles",
  pv_skip_holidays: "skipHolidays",
  pv_unissued_none: "unissuedNone",
  pv_data_edit_logs: "dataEditLogs",
  pv_adminpass: "adminpass",
  pv_githubPAT: "githubPAT"
};

window._fsSave = async function(k, v) {
  const fsKey = FS_KEYS[k];
  if (!fsKey) return;
  try {
    await setDoc(doc(db, "pvdata", fsKey), { value: JSON.stringify(v) });
  } catch(e) {
    console.warn("Firestore save error", e);
    throw e;
  }
};

// 履歴は複数PCで同時発行しても消えないよう、読み取り→IDマージ→書き込みをトランザクションで行う
window._fsSaveHistoryMerged = async function(localHistory, opts) {
  opts = opts || {};
  const deletedIds = new Set(opts.deletedIds || []);
  const ref = doc(db, "pvdata", "history");
  const merged = await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);
    let remote = [];
    if (snap.exists()) {
      try {
        const raw = snap.data().value;
        remote = typeof raw === "string" ? JSON.parse(raw) : (raw || []);
      } catch { remote = []; }
    }
    if (!Array.isArray(remote)) remote = [];
    const map = new Map();
    remote.forEach(h => {
      if (h && h.id != null && !deletedIds.has(h.id)) map.set(h.id, h);
    });
    (localHistory || []).forEach(h => {
      if (!h || h.id == null || deletedIds.has(h.id)) return;
      map.set(h.id, h);
    });
    const result = [...map.values()].sort((a, b) => new Date(b.issueDate || 0) - new Date(a.issueDate || 0));
    transaction.set(ref, { value: JSON.stringify(result) });
    return result;
  });
  try { localStorage.setItem("pv_history", JSON.stringify(merged)); } catch {}
  return merged;
};

window._fsLoad = async function(k) {
  const fsKey = FS_KEYS[k];
  if (!fsKey) return null;
  try {
    const snap = await getDoc(doc(db, "pvdata", fsKey));
    if (snap.exists()) { const raw=snap.data().value; try{return JSON.parse(raw);}catch{return raw;} }
  } catch(e) { console.warn("Firestore load error", e); }
  return null;
};

// リアルタイム同期（ログイン後に開始）
const watchKeys = ["customers","products","prices","history","invoiceCounters","closingDays","minG","cycles","skipHolidays","unissuedNone","dataEditLogs"];
window._startRealtimeSync = function() {
if(window._realtimeSyncStarted)return;
window._realtimeSyncStarted=true;
watchKeys.forEach(fsKey => {
  const localKey = Object.keys(FS_KEYS).find(k => FS_KEYS[k] === fsKey);
  onSnapshot(doc(db, "pvdata", fsKey), (snap) => {
    if (!snap.exists()) return;
    try {
      const val = JSON.parse(snap.data().value);
      try { localStorage.setItem(localKey, JSON.stringify(val)); } catch{}
      const st = window._state;
      if (st) {
        if (localKey === "pv_customers") st.customers = val;
        else if (localKey === "pv_products") st.products = val;
        else if (localKey === "pv_prices") st.prices = val;
        else if (localKey === "pv_history") {
          // 発行処理中は自分の書き込みによるonSnapshotで上書きしない
          if (!window._issuingInvoice) st.history = val;
        }
        else if (localKey === "pv_invoice_counters") st.invoiceCounters = val;
        else if (localKey === "pv_closing_days") st.closingDays = val;
        else if (localKey === "pv_min") st.minG = val;
        else if (localKey === "pv_cycles") {
          if (!window._savingCycles && typeof window.replaceCycles === "function") window.replaceCycles(val);
        }
        else if (localKey === "pv_skip_holidays") st.skipHolidays = val;
        else if (localKey === "pv_unissued_none") st.unissuedNone = val;
        else if (localKey === "pv_data_edit_logs") st.dataEditLogs = Array.isArray(val)?val:[];
      }
      if (st && !st.showPrint && !st.editingHistory && !st.customerDetail && typeof render === "function") {
        render();
      }
    } catch(e) { console.warn("Firestore sync error", e); }
  });
});
}; // end _startRealtimeSync

// 初回起動：Firestoreから最新データをlocalStorageへ同期（ログイン後に実行）
window._startFirestoreSync = async function() {
  window._fsInitPromise = Promise.all(watchKeys.map(async fsKey => {
    const localKey = Object.keys(FS_KEYS).find(k => FS_KEYS[k] === fsKey);
    const val = await window._fsLoad(localKey);
    if (val !== null) {
      try { localStorage.setItem(localKey, JSON.stringify(val)); } catch{}
      // DELIVERY_CYCLESも初回ロード時に反映
      if(localKey === "pv_cycles" && typeof window.replaceCycles === "function") {
        try { window.replaceCycles(val); } catch{}
      }
    }
  }));
  window._startRealtimeSync();
  return window._fsInitPromise;
};
</script>

const DEFAULT_QTY_TIERS=()=>[{min:1,max:null,price:0}];
function hasQtyTiers(rec){return rec&&Array.isArray(rec.qtyTiers)&&rec.qtyTiers.length>0;}
function hasVariablePrice(rec){return!!(rec&&rec.variablePrice&&!hasQtyTiers(rec));}
function resolveUnitPrice(rec,qty){
  const q=parseFloat(qty)||0;
  if(!hasQtyTiers(rec))return parseFloat(rec?.price)||0;
  if(q<=0)return rec.qtyTiers[0].price;
  for(const t of rec.qtyTiers){
    const min=t.min??1;
    const max=t.max==null?Infinity:t.max;
    if(q>=min&&q<=max)return t.price;
  }
  return rec.qtyTiers[rec.qtyTiers.length-1].price;
}
function formatTierLabel(rec){
  if(!hasQtyTiers(rec))return"";
  return rec.qtyTiers.map(t=>{
    const maxLabel=t.max==null?`${t.min}枚〜`:`${t.min}〜${t.max}枚`;
    return `${maxLabel}: ¥${t.price}`;
  }).join(" / ");
}

function nthMonday(y,m,n){ // m:1-12, n:第n月曜
  const first=new Date(y,m-1,1);
  const firstMon=1+((8-first.getDay())%7);
  return firstMon+(n-1)*7;
}
function springEquinox(y){ // 春分の日（近似式）
  return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
}
function autumnEquinox(y){ // 秋分の日（近似式）
  return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
}
function japaneseHolidaySet(y){
  const set=new Set();
  const add=(m,d)=>set.add(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  // 固定祝日
  add(1,1);  // 元日
  add(2,11); // 建国記念の日
  if(y>=2020)add(2,23); // 天皇誕生日（2019年5月1日即位、2020〜2/23）
  add(4,29); // 昭和の日
  add(5,3);  // 憲法記念日
  add(5,4);  // みどりの日
  add(5,5);  // こどもの日
  if(y>=2016)add(8,11); // 山の日
  add(11,3); // 文化の日
  add(11,23);// 勤労感謝の日
  // ハッピーマンデー
  add(1,nthMonday(y,1,2)); // 成人の日
  if(y>=2003)add(7,nthMonday(y,7,3)); // 海の日（7月第3月曜）
  else add(7,20);
  add(9,nthMonday(y,9,3)); // 敬老の日
  if(y>=2020)add(10,nthMonday(y,10,2)); // スポーツの日
  else if(y>=2000)add(10,nthMonday(y,10,2)); // 体育の日
  else add(10,10);
  // 春分・秋分
  add(3,springEquinox(y));
  add(9,autumnEquinox(y));
  // 振替休日（日曜と重なった祝日の翌日以降、祝日でない日まで）
  const keys=[...set].sort();
  keys.forEach(k=>{
    const[yy,mm,dd]=k.split("-").map(Number);
    const d=new Date(yy,mm-1,dd);
    if(d.getDay()!==0)return;
    const n=new Date(d);
    do{n.setDate(n.getDate()+1);}while(set.has(toInput(n)));
    add(n.getMonth()+1,n.getDate());
  });
  // 国民の休日（祝日と祝日に挟まれた平日）
  const sorted=[...set].sort();
  for(let i=0;i<sorted.length-1;i++){
    const a=new Date(sorted[i]);
    const b=new Date(sorted[i+1]);
    const diff=(b-a)/86400000;
    if(diff===2){
      const mid=new Date(a);mid.setDate(a.getDate()+1);
      if(mid.getDay()!==0)add(mid.getMonth()+1,mid.getDate());
    }
  }
  return set;
}

}

  const listItems=state.issue.items.filter(i=>i.qty&&parseFloat(i.qty)>0);
  const customItems=(state.issue.customItems||[]).filter(i=>i.name&&i.qty&&parseFloat(i.qty)>0);
  return [...listItems,...customItems.map(i=>({...i,code:i.code||"★"}))];
}
function buildInvoiceItems(){
  const items=activeItems().map(i=>{
    const price=hasQtyTiers(i)?resolveUnitPrice(i,i.qty):(parseFloat(i.price)||0);
    const row={...i,price};
    delete row.refPrice;
    return row;
  });
  if(isKanagawaRodoCustomer(state.issue.customer)&&state.issue.deliverySite){
    return[makeRodoSiteItem(state.issue.deliverySite),...items];
  }
  return items;
}
function getTotal(){const sub=getSubtotal();const mg=state.minG[state.issue.customer]||0;return Math.max(sub,mg);}

function showToast(msg,type="success"){const t=document.getElementById("toast");t.textContent=msg;t.style.background=type==="success"?"#2d6a4f":"#c62828";t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2500);}

// --- Render ---
function render(){
  renderNav();
  const main=document.getElementById("main");
  if(state.tab===0)main.innerHTML=renderIssueTab();
  else if(state.tab===1)main.innerHTML=renderHistoryTab();
  else if(state.tab===2)main.innerHTML=renderStatsTab();
  else if(state.tab===3)renderDataTab();
  else if(state.tab===4)main.innerHTML=renderSettingsTab();
  else if(state.tab===5)main.innerHTML=renderGuideTab();
  else if(state.tab===6)main.innerHTML=renderUserTab();
  bindEvents();
  if(state.showPrint)renderPrintModal();
  if(state.meisaiView)renderMeisaiModal();
}

function renderNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML=TABS.map((t,i)=>`<button class="${state.tab===i?"active":""}" onclick="setTab(${i})">${t}</button>`).join("");
  const backBtn=document.getElementById("back-btn");
  if(state.tabHistory.length>0||state.customerDetail){
    backBtn.style.display="inline-block";
  } else {
    backBtn.style.display="none";
  }
  updateUnissuedAlerts();
}

function updateUnissuedAlerts(){
  const layout=document.getElementById("app-layout");
  const sidebar=document.getElementById("unissued-sidebar");
  if(!window._currentUser){
    if(sidebar)sidebar.style.display="none";
    if(layout)layout.classList.remove("has-sidebar");
    return;
  }
  const alerts=getUnissuedAlerts();
  const count=alerts.length;
  if(count>0){
    const todayCount=alerts.filter(a=>a.label==="本日").length;
    const tomorrowCount=alerts.filter(a=>a.label==="明日").length;
    const yesterdayCount=alerts.filter(a=>a.label==="昨日").length;
    const parts=[];
    if(yesterdayCount)parts.push(`昨日${yesterdayCount}件`);
    if(todayCount)parts.push(`本日${todayCount}件`);
    if(tomorrowCount)parts.push(`明日${tomorrowCount}件`);
    const detail=parts.join("・");
    if(layout)layout.classList.add("has-sidebar");
    if(sidebar){
      sidebar.style.display="block";
      const items=alerts.map(a=>{
        const cAttr=String(a.customer||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
        const dAttr=String(a.dateStr||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
        return`
        <div class="unissued-sidebar-item">
          <button type="button" class="unissued-sidebar-item-main" data-customer="${cAttr}" data-datestr="${dAttr}" onclick="selectCustomerFromSidebar(this.dataset.customer,this.dataset.datestr)">
            <div class="unissued-sidebar-name">${cAttr}</div>
            <div class="unissued-sidebar-meta">
              <span>${fmtDate(a.date)}（${a.dayName}）</span>
              <span class="unissued-sidebar-badge ${a.label==="本日"?"today":a.label==="昨日"?"yesterday":"tomorrow"}">${a.label}</span>
            </div>
          </button>
          <button type="button" class="unissued-sidebar-none" data-customer="${cAttr}" data-datestr="${dAttr}" onclick="event.stopPropagation();markUnissuedNone(this.dataset.customer,this.dataset.datestr)">発行なし</button>
        </div>`;
      }).join("");
      sidebar.innerHTML=`<div class="unissued-sidebar-card">
        <div class="unissued-sidebar-head">
          <h3>⚠️ 未発行 ${count}件</h3>
          <p>${detail}</p>
        </div>
        <div class="unissued-sidebar-list">${items}</div>
      </div>`;
    }
  }else{
    if(sidebar)sidebar.style.display="none";
    if(layout)layout.classList.remove("has-sidebar");
  }
}

function setTab(i){
  state.tabHistory.push(state.tab);
  if(state.tabHistory.length>20)state.tabHistory.shift();
  state.tab=i;
  state.customerDetail=null;
  render();
}

function goBack(){
  if(state.customerDetail){state.customerDetail=null;render();return;}
  if(state.tabHistory.length>0){
    state.tab=state.tabHistory.pop();
    render();
  }
}

function resetIssueCustomItems(){
  state.issue.customItems=[{name:"",qty:"",price:""}];
  state.issue.customPanelOpen=false;
}

function selectCustomer(name){
  if(name==="__FREE__"){
    state.issue.freeCustomer=true;
    state.issue.customer="";
    state.issue.items=[];
    resetIssueCustomItems();
    state.issue.useCustom=true;
    state.issue.customPanelOpen=true;
    const today=new Date();today.setDate(today.getDate()+1);
    state.issue.deliveryDate=toInput(today);
    render();
    setTimeout(()=>{const el=document.getElementById("free-customer-input");if(el)el.focus();},50);
    return;
  }
  state.issue.freeCustomer=false;
  state.issue.customer=name;
  state.issue.deliverySite=isKanagawaRodoCustomer(name)?(state.issue.deliverySite||KANAGAWA_RODO_SITES[0]):"";
  if(!name){state.issue.items=[];state.issue.deliveryDate="";state.issue.deliverySite="";resetIssueCustomItems();render();return;}
  resetIssueCustomItems();
  state.issue.deliveryDate=toInput(nextDelivery(name));
  const cp=state.prices.filter(p=>p.customer===name);
  state.issue.items=cp.map(p=>{
    const item={...p,qty:""};
    if(hasQtyTiers(p)){
      item.qtyTiers=p.qtyTiers.map(t=>({...t}));
      item.price=resolveUnitPrice(p,0);
    }else if(hasVariablePrice(p)){
      item.refPrice=p.price||0;
      item.price="";
    }
    return item;
  });
  state.issue.useCustom=cp.length===0;
  state.issue.customPanelOpen=cp.length===0;
  render();
  focusFirstQtyInput();
}
function focusFirstQtyInput(){
  setTimeout(()=>{
    const el=document.querySelector("[data-qty-idx='0']");
    if(el){el.focus();el.select();return;}
    const custom=document.querySelector("#main input[placeholder='品名']");
    if(custom)custom.focus();
  },50);
}
function setFreeCustomer(val){
  // 入力中にrender()するとフォーカスが消えるため、状態更新のみ
  state.issue.customer=val;
}
function setItemQty(i,v){
  state.issue.items[i].qty=v;
  const it=state.issue.items[i];
  if(hasQtyTiers(it))it.price=resolveUnitPrice(it,v);
  render();
}
function setItemPrice(i,v,refreshTotal){
  if(!state.issue.items[i])return;
  state.issue.items[i].price=v;
  if(refreshTotal){
    updateIssueTotalsDisplay();
    const input=document.querySelector(`[data-price-idx="${i}"]`);
    const tr=input?.closest("tr");
    const it=state.issue.items[i];
    const unitPrice=parseFloat(v)||0;
    const amtTd=tr?.querySelector("td:nth-child(5)");
    if(amtTd)amtTd.textContent=it.qty&&unitPrice?`¥${(parseInt(it.qty)*unitPrice).toLocaleString()}`:"—";
  }
}
function qtyKeyDown(e,i){
  if(e.key==="Enter"){
    e.preventDefault();
    state.issue.items[i].qty=e.target.value;
    const it=state.issue.items[i];
    if(hasQtyTiers(it))it.price=resolveUnitPrice(it,e.target.value);
    const nextIdx=i+1;
    render();
    // render後にフォーカスを次の入力欄へ移動
    const inputs=document.querySelectorAll("[data-qty-idx]");
    const next=Array.from(inputs).find(el=>parseInt(el.dataset.qtyIdx)===nextIdx);
    if(next){next.focus();next.select();}
    else{const btn=document.querySelector(".issue-btn");if(btn)btn.focus();}
  }
}
function setCustomItem(i,k,v,refreshTotal){
  if(!state.issue.customItems[i])return;
  // 入力中にrender()するとフォーカスが消えるため、状態と合計表示だけ更新
  state.issue.customItems[i][k]=v;
  if(refreshTotal)updateIssueTotalsDisplay();
}
function updateIssueTotalsDisplay(){
  const sub=getSubtotal();
  const mg=state.minG[state.issue.customer]||0;
  const total=Math.max(sub,mg);
  const totalEl=document.getElementById("issue-total-amount");
  if(totalEl)totalEl.textContent="¥"+total.toLocaleString();
  const noteEl=document.getElementById("issue-mg-note");
  if(noteEl)noteEl.innerHTML=mg>0&&sub<mg?`<div style="font-size:13px;color:#c17a00">小計 ¥${sub.toLocaleString()} → 最低保証 ¥${mg.toLocaleString()} 適用</div>`:"";
}

function showProductPicker(){
  const picker=document.getElementById("product-picker");
  if(picker)picker.style.display=picker.style.display==="none"?"block":"none";
}

function addFromPicker(){
  const code=document.getElementById("picker-product").value;
  const qty=document.getElementById("picker-qty").value;
  const price=document.getElementById("picker-price").value;
  if(!code){alert("商品を選択してください");return;}
  if(!qty){alert("数量を入力してください");return;}
  const prod=state.products.find(p=>p.code===code);
  if(!prod)return;
  const unitPrice=price?parseInt(price):(()=>{
    const pr=state.prices.find(p=>p.customer===state.issue.customer&&p.code===code);
    return pr?resolveUnitPrice(pr,qty):0;
  })();
  if(!state.issue.customItems)state.issue.customItems=[{name:"",qty:"",price:""}];
  state.issue.customPanelOpen=true;
  // 空の行があれば使う、なければ追加
  const emptyIdx=state.issue.customItems.findIndex(it=>!it.name&&!it.qty&&!it.price);
  if(emptyIdx>=0){
    state.issue.customItems[emptyIdx]={name:prod.name,qty:parseInt(qty),price:unitPrice};
  } else {
    state.issue.customItems.push({name:prod.name,qty:parseInt(qty),price:unitPrice});
  }
  document.getElementById("picker-product").value="";
  document.getElementById("picker-qty").value="";
  document.getElementById("picker-price").value="";
  document.getElementById("product-picker").style.display="none";
  render();
}

function addCustomItem(){
  if(!state.issue.customItems)state.issue.customItems=[];
  state.issue.customPanelOpen=true;
  const hasEmpty=state.issue.customItems.some(it=>!it.name&&!it.qty&&!it.price);
  if(!hasEmpty)state.issue.customItems.push({name:"",qty:"",price:""});
  render();
  // 最後の自由入力行にフォーカス
  setTimeout(()=>{
    const inputs=document.querySelectorAll("#main input[placeholder='品名']");
    if(inputs.length>0)inputs[inputs.length-1].focus();
  },50);
}

function removeCustomItem(i){
  state.issue.customItems.splice(i,1);
  if(!state.issue.customItems.length){
    state.issue.customItems=[{name:"",qty:"",price:""}];
    state.issue.customPanelOpen=false;
  }
  render();
}
function toggleCustom(v){state.issue.useCustom=v;render();}
async function issueInvoice(){
  if(window._issuingBusy){showToast("発行処理中です","error");return;}
  if(!state.issue.customer&&!state.issue.freeCustomer){showToast("客先を選択してください","error");return;}
  if(state.issue.freeCustomer&&!state.issue.customer.trim()){showToast("客先名を入力してください","error");return;}
  if(isKanagawaRodoCustomer(state.issue.customer)&&!state.issue.deliverySite){showToast("納品先を選択してください","error");return;}
  const items=buildInvoiceItems();
  if(!items.some(i=>!i.isDeliverySite&&i.qty&&parseFloat(i.qty)>0)){showToast("数量を入力してください","error");return;}
  const missingVarPrice=state.issue.items.some(i=>hasVariablePrice(i)&&i.qty&&parseFloat(i.qty)>0&&!(parseFloat(i.price)>0));
  if(missingVarPrice){showToast("都度単価の品目に単価を入力してください","error");return;}
  const sub=getSubtotal();const mg=state.minG[state.issue.customer]||0;const total=Math.max(sub,mg);
  const invNoKey=state.issue.freeCustomer?"__FREE__":state.issue.customer;
  let id=Date.now();
  while(state.history.some(h=>h.id===id))id++;
  const inv={id,invoiceNo:nextInvoiceNo(invNoKey),customer:state.issue.customer,deliveryDate:state.issue.deliveryDate?fromInput(state.issue.deliveryDate):new Date(),issueDate:new Date(),items,subtotal:sub,minGuarantee:mg,total,memo:state.issue.memo||"",deliverySite:state.issue.deliverySite||"",issuedBy:window._userShortId||"",issuedByName:window._userDisplayName||""};
  window._issuingBusy=true;
  window._issuingInvoice=true;
  state.history.unshift(inv);
  showToast("保存中...");
  try{
    await saveHistoryMerged(state.history);
    const invPrefix=inv.invoiceNo.split("-")[0];
    const invNum=parseInt((inv.invoiceNo.split("-P")[1])||0);
    if(!state.invoiceCounters[invPrefix]||state.invoiceCounters[invPrefix]<invNum){
      state.invoiceCounters[invPrefix]=invNum;
      save("pv_invoice_counters",state.invoiceCounters);
    }
    const threeMonthsAgo=new Date();threeMonthsAgo.setMonth(threeMonthsAgo.getMonth()-3);
    const gone=state.history.filter(h=>new Date(h.issueDate)<threeMonthsAgo).map(h=>h.id);
    if(gone.length){
      state.history=state.history.filter(h=>new Date(h.issueDate)>=threeMonthsAgo);
      await saveHistoryMerged(state.history,{deletedIds:gone});
    }
    try{
      const {addDoc,collection}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
      await addDoc(collection(window._db,"pvInvoiceLogs"),{
        invoiceNo:inv.invoiceNo,
        customer:inv.customer,
        total:inv.total,
        issuedBy:inv.issuedBy||"",
        issuedByName:inv.issuedByName||"",
        deliveryDate:inv.deliveryDate instanceof Date?inv.deliveryDate.toISOString():inv.deliveryDate,
        issuedAt:new Date().toISOString()
      });
    }catch(e){console.warn("発行ログ保存エラー",e);}
    state.issue.freeCustomer=false;state.issue.memo="";
    state.issue.items=state.issue.items.map(i=>{
      const row={...i,qty:""};
      if(hasVariablePrice(i))row.price="";
      return row;
    });
    state.issue.customItems=[{name:"",qty:"",price:""}];
    state.issue.customPanelOpen=false;
    state.printInvoice=inv;render();renderPrintModal(true);
  }catch(e){
    console.error("履歴保存エラー",e);
    state.history=state.history.filter(h=>h.id!==inv.id);
    try{localStorage.setItem("pv_history",JSON.stringify(state.history));}catch{}
    showToast("⚠️ 履歴の保存に失敗しました。ネットワークを確認してください。","error");
    render();
  }finally{
    window._issuingBusy=false;
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
}

function recalcHistoryTotal(){
  const eh=state.editingHistory;
  const sub=eh.items.reduce((s,i)=>(parseFloat(i.qty)||0)*(parseFloat(i.price)||0)+s,0);
  eh.subtotal=sub;
  eh.total=Math.max(sub,eh.minGuarantee||0);
  render();
}
function removeHistoryItem(i){state.editingHistory.items.splice(i,1);recalcHistoryTotal();}
function addHistoryItem(){state.editingHistory.items.push({name:"",qty:"",price:0});render();}
async function saveHistoryEdit(){
  const eh=state.editingHistory;
  const sub=eh.items.reduce((s,i)=>(parseFloat(i.qty)||0)*(parseFloat(i.price)||0)+s,0);
  const total=Math.max(sub,eh.minGuarantee||0);
  state.history=state.history.map(h=>{
    if(h.id!==eh.id)return h;
    const updated={...h,invoiceNo:eh.invoiceNo,deliveryDate:eh.deliveryDate?fromInput(eh.deliveryDate):h.deliveryDate,items:eh.items,subtotal:sub,total};
    delete updated.billingExportedAt;
    return updated;
  });
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history);
    state.editingHistory=null;showToast("修正を保存しました");
  }catch(e){
    console.error("履歴修正保存エラー",e);
    showToast("⚠️ 保存に失敗しました","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}

async function toggleVoid(id){
  const h=state.history.find(x=>x.id===id);
  if(!h||isIssueNone(h))return;
  const msg=h.void?"この伝票の没を解除しますか？":"この伝票を没にしますか？";
  if(!confirm(msg))return;
  const prevVoid=!!h.void;
  const prevExportedAt=h.billingExportedAt;
  h.void=!h.void;
  // 復活したら請求明細の未反映に戻す
  if(prevVoid&&!h.void)delete h.billingExportedAt;
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history);
    showToast(h.void?"没にしました":(prevExportedAt?"没を解除しました（未反映に戻しました）":"没を解除しました"));
  }catch(e){
    console.error("没フラグ保存エラー",e);
    h.void=prevVoid;
    if(prevExportedAt)h.billingExportedAt=prevExportedAt;
    else delete h.billingExportedAt;
    showToast("保存に失敗しました","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}

async function deleteHistory(id){
  if(!confirm("この履歴を削除しますか？"))return;
  const target=state.history.find(h=>h.id===id);
  const backup=state.history.slice();
  state.history=state.history.filter(h=>h.id!==id);
  let noneKey=null;
  if(target&&isIssueNone(target)){
    const dateStr=historyDeliveryKey(target);
    noneKey=unissuedNoneKey(target.customer,dateStr);
    if(state.unissuedNone)delete state.unissuedNone[noneKey];
  }
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history,{deletedIds:[id]});
    if(noneKey){
      save("pv_unissued_none",state.unissuedNone||{});
    }
    showToast("削除しました");
  }catch(e){
    console.error("履歴削除保存エラー",e);
    state.history=backup;
    if(noneKey&&target){
      if(!state.unissuedNone)state.unissuedNone={};
      state.unissuedNone[noneKey]=true;
    }
    showToast("保存に失敗しました","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}

function toggleCycleDay(day){
  const d=state.customerDetail;
  if(d.cycle.includes(day)){d.cycle=d.cycle.replace(day,"");}
  else{
    const order=["月","火","水","木","金","土","日"];
    let c=d.cycle+day;
    d.cycle=order.filter(x=>c.includes(x)).join("");
  }
  render();
}

function setDetailNewCode(v){
  const p=state.products.find(x=>x.code===v);
  const nameEl=document.getElementById("dp-name");
  if(nameEl)nameEl.value=p?.name||"";
}
function setDetailNewPriceMode(mode){
  if(!state.customerDetail)return;
  state.customerDetail.newPriceMode=mode;
  if(mode==="tiered"){
    const priceEl=document.getElementById("dp-price");
    const base=priceEl?parseInt(priceEl.value)||0:0;
    if(!state.customerDetail.newPriceTiers||!state.customerDetail.newPriceTiers.length){
      state.customerDetail.newPriceTiers=[{min:1,max:null,price:base}];
    }
  }
  render();
}
function addDetailNewPriceTier(){
  if(!state.customerDetail.newPriceTiers)state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  const last=state.customerDetail.newPriceTiers[state.customerDetail.newPriceTiers.length-1];
  const nextMin=last?(last.max?last.max+1:(last.min+1)):1;
  state.customerDetail.newPriceTiers.push({min:nextMin,max:null,price:last?last.price:0});
  render();
}
function removeDetailNewPriceTier(ti){
  if(!state.customerDetail.newPriceTiers)return;
  state.customerDetail.newPriceTiers.splice(ti,1);
  if(!state.customerDetail.newPriceTiers.length)state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  render();
}

function setDetailPriceType(i,type){
  const p=state.customerDetail.prices[i];
  if(type==="fixed"){
    delete p.qtyTiers;
    delete p.variablePrice;
    if(p.price===undefined||p.price==="")p.price=0;
  }else if(type==="tiered"){
    delete p.variablePrice;
    p.qtyTiers=[{min:1,max:null,price:p.price||0}];
    p.price=p.price||0;
  }else if(type==="variable"){
    delete p.qtyTiers;
    p.variablePrice=true;
    if(p.price===undefined)p.price=0;
  }
  render();
}
function toggleDetailPriceTier(i){setDetailPriceType(i,hasQtyTiers(state.customerDetail.prices[i])?"fixed":"tiered");}
function addDetailPriceTier(i){
  const p=state.customerDetail.prices[i];
  if(!hasQtyTiers(p))p.qtyTiers=[];
  const last=p.qtyTiers[p.qtyTiers.length-1];
  const nextMin=last?(last.max?last.max+1:(last.min+1)):1;
  p.qtyTiers.push({min:nextMin,max:null,price:last?last.price:0});
  render();
}
function removeDetailPriceTier(i,ti){
  state.customerDetail.prices[i].qtyTiers.splice(ti,1);
  if(!state.customerDetail.prices[i].qtyTiers.length)delete state.customerDetail.prices[i].qtyTiers;
  render();
}

function addDetailPrice(){
  const code=document.getElementById("dp-code").value;
  const name=document.getElementById("dp-name").value;
  if(!code||!name){showToast("コードと品名を入力してください","error");return;}
  const mode=state.customerDetail.newPriceMode||"fixed";
  const row={customer:state.customerDetail.name,code,name,price:0};
  if(mode==="tiered"){
    const tiers=(state.customerDetail.newPriceTiers||[]).map(t=>({min:t.min??1,max:t.max==null?null:t.max,price:parseInt(t.price)||0}));
    if(!tiers.length){showToast("数量別単価を入力してください","error");return;}
    if(tiers.some(t=>!t.price&&t.price!==0)){showToast("各段階の単価を入力してください","error");return;}
    row.qtyTiers=tiers;
    row.price=tiers[0].price;
  }else if(mode==="variable"){
    const price=parseInt(document.getElementById("dp-price")?.value)||0;
    row.variablePrice=true;
    row.price=price;
  }else{
    const price=parseInt(document.getElementById("dp-price")?.value)||0;
    row.price=price;
  }
  state.customerDetail.prices.push(row);
  state.customerDetail.newPriceMode="fixed";
  state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  render();
}

function removeDetailPrice(i){
  state.customerDetail.prices.splice(i,1);render();
}

function saveCustomerDetail(){
  const d=state.customerDetail;
  if(!state.skipHolidays)state.skipHolidays={};
  const renamed=d.originalName!==d.name;
  state.customers=state.customers.map(c=>c.id===d.id?{...c,name:d.name}:c);
  if(renamed){
    state.minG[d.name]=state.minG[d.originalName]||0;
    delete state.minG[d.originalName];
    DELIVERY_CYCLES[d.name]=DELIVERY_CYCLES[d.originalName];
    delete DELIVERY_CYCLES[d.originalName];
    if(state.closingDays[d.originalName]!==undefined){state.closingDays[d.name]=state.closingDays[d.originalName];delete state.closingDays[d.originalName];}
    if(state.skipHolidays[d.originalName]!==undefined){state.skipHolidays[d.name]=state.skipHolidays[d.originalName];delete state.skipHolidays[d.originalName];}
    state.prices=state.prices.map(p=>p.customer===d.originalName?{...p,customer:d.name}:p);
    state.history=state.history.map(h=>h.customer===d.originalName?{...h,customer:d.name}:h);
    migrateUnissuedNoneKeys(d.originalName,d.name);
  }
  state.minG[d.name]=d.mg;
  if(d.cycle&&String(d.cycle).trim())DELIVERY_CYCLES[d.name]=String(d.cycle).trim();
  else delete DELIVERY_CYCLES[d.name];
  if(d.closingDay!=="")state.closingDays[d.name]=d.closingDay;
  if(d.skipHoliday)state.skipHolidays[d.name]=true;
  else delete state.skipHolidays[d.name];
  state.prices=state.prices.filter(p=>p.customer!==d.name);
  state.prices.push(...d.prices.map(p=>{
    const row={...p,customer:d.name};
    if(hasQtyTiers(row))row.price=row.qtyTiers[0].price;
    if(hasVariablePrice(row))delete row.qtyTiers;
    return row;
  }));
  state.customerDetail=null;
  save("pv_customers",state.customers);save("pv_min",state.minG);save("pv_closing_days",state.closingDays);save("pv_skip_holidays",state.skipHolidays);save("pv_prices",state.prices);saveCycles();
  if(renamed){
    save("pv_unissued_none",state.unissuedNone||{});
    window._issuingInvoice=true;
    saveHistoryMerged(state.history).catch(e=>console.error("客先リネーム履歴保存",e)).finally(()=>{
      setTimeout(()=>{window._issuingInvoice=false;},2000);
    });
  }
  if(window._fsSave){
    window._fsSave("pv_customers",state.customers).catch(e=>console.error(e));
    window._fsSave("pv_min",state.minG).catch(e=>console.error(e));
    window._fsSave("pv_closing_days",state.closingDays).catch(e=>console.error(e));
    window._fsSave("pv_skip_holidays",state.skipHolidays).catch(e=>console.error(e));
    window._fsSave("pv_prices",state.prices).catch(e=>console.error(e));
    if(renamed){
      window._fsSave("pv_unissued_none",state.unissuedNone||{}).catch(e=>console.error(e));
    }
  }
  if(window._saveDataEditLog)window._saveDataEditLog("客先",`${d.name} を保存（サイクル:${d.cycle} 最低保証:${d.mg} 締め日:${d.closingDay} 祝日:${d.skipHoliday?"飛ばす":"納品あり"}）`);
  showToast(renamed?"客先名を変更し、履歴も更新しました":"保存しました");
  render();
}

function saveCustomer(id){

    state.prices=state.prices.map(p=>p.customer===ec.originalName?{...p,customer:ec.name}:p);
  }

    window._issuingInvoice=true;
    saveHistoryMerged(state.history).catch(e=>console.error(e)).finally(()=>setTimeout(()=>{window._issuingInvoice=false;},2000));
  }
  if(window._fsSave){
    window._fsSave("pv_customers",state.customers).catch(e=>console.error(e));
    window._fsSave("pv_min",state.minG).catch(e=>console.error(e));
    if(ec.originalName!==ec.name){

      window._fsSave("pv_closing_days",state.closingDays).catch(e=>console.error(e));
      window._fsSave("pv_skip_holidays",state.skipHolidays||{}).catch(e=>console.error(e));
    }
  }
  showToast("更新しました");render();
}

function saveProduct(oldCode){
  const ep=state.editingProduct;
  if(!ep.code||!ep.name){showToast("コードと品名を入力してください","error");return;}
  if(ep.code!==oldCode&&state.products.find(p=>p.code===ep.code)){showToast("同じコードが存在します","error");return;}
  state.products=state.products.map(p=>p.code===oldCode?{code:ep.code,name:ep.name}:p);
  if(ep.code!==oldCode){state.prices=state.prices.map(p=>p.code===oldCode?{...p,code:ep.code,name:ep.name}:p);}
  if(window._saveDataEditLog)window._saveDataEditLog("商品",`${oldCode}→${ep.code} ${ep.name} を更新`);
  state.editingProduct=null;save("pv_products",state.products);if(window._fsSave)window._fsSave("pv_products",state.products);showToast("更新しました");render();
}
function deleteProduct(code){if(!confirm("削除しますか？"))return;const dp=state.products.find(p=>p.code===code);state.products=state.products.filter(p=>p.code!==code);save("pv_products",state.products);if(window._fsSave)window._fsSave("pv_products",state.products);if(window._saveDataEditLog&&dp)window._saveDataEditLog("商品",`${dp.code} ${dp.name} を削除`);showToast("削除しました");render();}
function nextProductCode(){const codes=state.products.map(p=>p.code).filter(c=>/^W\d+$/.test(c)).map(c=>parseInt(c.replace("W","")));const mx=codes.length?Math.max(...codes):0;return"W"+String(mx+1).padStart(3,"0");}

function getClosingPeriod(closingDay, baseYear, baseMonth) {
  let to, from;
  if (closingDay === 0) {
    // 月末締め: 当月1日〜当月末日
    to = new Date(baseYear, baseMonth, 0); // 月末
    from = new Date(baseYear, baseMonth - 1, 1);
  } else {
    // N日締め: 前月(N+1)日〜当月N日
    to = new Date(baseYear, baseMonth - 1, closingDay);
    from = new Date(baseYear, baseMonth - 2, closingDay + 1);
  }
  return { from, to };
}

function dateInRange(dateVal, from, to) {
  const d = new Date(dateVal);
  if (isNaN(d)) return false;
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const f = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const t = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  return dd >= f && dd <= t;
}

function resolveClosingDay(customer){
  const cd=state.closingDays[customer];
  return (cd!==undefined&&cd!=="")?cd:0;
}

function getBillingMonthFromDate(dateVal, closingDay){
  const d=new Date(dateVal);
  if(isNaN(d))return null;
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  if(!closingDay)return {year:y, month:m};
  if(day>closingDay){
    if(m===12)return {year:y+1, month:1};
    return {year:y, month:m+1};
  }
  return {year:y, month:m};
}

function pendingBillingInvoices(){
  return (state.history||[]).filter(h=>isRealInvoice(h)&&!h.billingExportedAt);
}

function lastBillingExportBatch(){
  const stamped=(state.history||[]).filter(h=>isRealInvoice(h)&&h.billingExportedAt);
  if(!stamped.length)return [];
  const latest=stamped.reduce((m,h)=>h.billingExportedAt>m?h.billingExportedAt:m,"");
  return stamped.filter(h=>h.billingExportedAt===latest);
}

async function undoLastBillingExport(){
  const batch=lastBillingExportBatch();
  if(!batch.length){showToast("取り消せる反映がありません","error");return;}
  if(!confirm("直前の請求明細反映（"+batch.length+"件）を未反映に戻しますか？\nもう一度「未反映→請求明細Excel」で出せます。"))return;
  const savedAt=batch.map(h=>h.billingExportedAt);
  batch.forEach(h=>{delete h.billingExportedAt;});
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history);
    showToast(batch.length+"件を未反映に戻しました");
  }catch(e){
    console.error("未反映へ戻す保存エラー",e);
    batch.forEach((h,i)=>{if(savedAt[i])h.billingExportedAt=savedAt[i];});
    showToast("保存に失敗しました。反映状態は変更されていません","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}

// プゥル・ヴー明細書.xlsm と同じレイアウトで .xlsx を直接生成
function sanitizeSheetName(n){return String(n||"").replace(/[\\/*?:\[\]]/g,"_").slice(0,31);}
function xlCol(n){let s="";while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function meisaiThin(){return{style:"thin",color:{argb:"FF000000"}};}
function meisaiBox(ws,r1,c1,r2,c2,inner){
  const t=meisaiThin();
  for(let r=r1;r<=r2;r++){
    for(let c=c1;c<=c2;c++){
      const b=inner?{top:t,left:t,bottom:t,right:t}:{};
      if(r===r1)b.top=t;if(r===r2)b.bottom=t;if(c===c1)b.left=t;if(c===c2)b.right=t;
      ws.getCell(r,c).border=b;
    }
  }
}
function formatMeisaiMD(dateVal){
  const d=new Date(dateVal);
  if(isNaN(d))return "";
  return (d.getMonth()+1)+"/"+d.getDate();
}
function invoicesToMeisaiItems(inv){
  return (inv.items||[]).filter(it=>!it.isDeliverySite&&it.name&&parseFloat(it.qty)>0).map(it=>({
    name:it.name,
    price:parseFloat(it.price)||0,
    qty:parseFloat(it.qty)||0
  }));
}
function calcMeisaiTotalsFromInvoices(invoices){
  let sub=0;
  (invoices||[]).forEach(inv=>{
    invoicesToMeisaiItems(inv).forEach(it=>{sub+=it.qty*it.price;});
  });
  const tax=Math.round(sub*0.1);
  return {subtotal:sub,tax,total:sub+tax};
}
function buildMeisaiSheetData(customer, invoices, year, month, sheetName, extra){
  return {
    customer,
    sheetName: sanitizeSheetName(sheetName),
    year,
    month,
    closingDay: resolveClosingDay(customer),
    invoices: invoices.map(inv=>({
      invoiceNo: inv.invoiceNo||"",
      deliveryDate: inv.deliveryDate,
      items: invoicesToMeisaiItems(inv)
    })),
    ...(extra||{})
  };
}
function collectMeisaiSheets(customer, invoices, year, month){
  const pageSize=14;
  const list=invoices||[];
  const pages=Math.max(1, Math.ceil(list.length/pageSize));
  const grand=calcMeisaiTotalsFromInvoices(list);
  const sheets=[];
  for(let p=0;p<pages;p++){
    const chunk=list.slice(p*pageSize,(p+1)*pageSize);
    const base=customer+"_"+year+"年"+month+"月";
    const sheetName=pages>1?base+"("+(p+1)+")":base;
    const pageTot=calcMeisaiTotalsFromInvoices(chunk);
    sheets.push(buildMeisaiSheetData(customer, chunk, year, month, sheetName, {
      pageIndex:p+1,
      pageCount:pages,
      grandSubtotal:grand.subtotal,
      grandTax:grand.tax,
      grandTotal:grand.total,
      pageSubtotal:pageTot.subtotal,
      pageTax:pageTot.tax,
      pageTotal:pageTot.total
    }));
  }
  return sheets;
}
const MEISAI_MAX_ITEM_ROWS=20;
const MEISAI_FIRST_ITEM_ROW=12;
const MEISAI_LAST_ITEM_ROW=MEISAI_FIRST_ITEM_ROW+MEISAI_MAX_ITEM_ROWS-1;
function countMeisaiItemsInSheetData(data){
  const keys=new Set();
  (data.invoices||[]).slice(0,14).forEach(inv=>{
    (inv.items||[]).forEach(it=>{keys.add(it.name+"|"+it.price);});
  });
  return keys.size;
}
function checkMeisaiSheetsOverflow(sheets){
  const over=[];
  (sheets||[]).forEach(s=>{
    const n=countMeisaiItemsInSheetData(s);
    if(n>MEISAI_MAX_ITEM_ROWS)over.push({sheetName:s.sheetName||s.customer,count:n});
  });
  return over;
}
function confirmMeisaiOverflow(sheets){
  const over=checkMeisaiSheetsOverflow(sheets);
  if(!over.length)return true;
  const msg=over.map(o=>"・"+o.sheetName+"（"+o.count+"品目 / 最大"+MEISAI_MAX_ITEM_ROWS+"）").join("\n");
  return confirm("品目がテンプレート上限（"+MEISAI_MAX_ITEM_ROWS+"行）を超えるシートがあります。\n"+msg+"\n\n超過分はExcel・画面表示に含まれません。続けますか？");
}

async function exportMeisaiWorkbook(sheets, filename){
  if(typeof ExcelJS==="undefined"){showToast("Excelライブラリの読み込みに失敗しました","error");return false;}
  if(!sheets.length){showToast("書き出すデータがありません","error");return false;}
  const wb=new ExcelJS.Workbook();
  sheets.forEach(data=>{
    const ws=wb.addWorksheet(data.sheetName);
    setupMeisaiSheet(ws,data);
  });
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
  return true;
}

function yenTxt(n){return "¥"+Math.round(n||0).toLocaleString();}
function gatherPendingMeisaiSheets(){
  const toMark=pendingBillingInvoices();
  if(!toMark.length)return {error:"未反映の伝票がありません",sheets:[]};
  const sheetMap=new Map();
  toMark.forEach(h=>{
    const cd=resolveClosingDay(h.customer);
    const bm=getBillingMonthFromDate(h.deliveryDate,cd);
    if(!bm)return;
    const customer=h.customer||"（客先不明）";
    const key=customer+"\0"+bm.year+"\0"+bm.month;
    if(!sheetMap.has(key))sheetMap.set(key,{customer,year:bm.year,month:bm.month,closingDay:cd});
  });
  const sheets=[];
  sheetMap.forEach(({customer,year,month,closingDay})=>{
    const {from,to}=getClosingPeriod(closingDay,year,month);
    const invoices=state.history.filter(h=>isRealInvoice(h)&&h.customer===customer&&dateInRange(h.deliveryDate,from,to));
    invoices.sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));
    if(!invoices.length)return;
    sheets.push(...collectMeisaiSheets(customer,invoices,year,month));
  });
  if(!sheets.length)return {error:"該当期間に発行履歴がありません",sheets:[]};
  return {sheets};
}
function gatherTodayMeisaiSheets(){
  const todayStr=fmtDate(new Date());
  const filtered=state.history.filter(h=>isRealInvoice(h)&&fmtDate(new Date(h.deliveryDate))===todayStr);
  if(!filtered.length)return {error:"今日の納品履歴がありません",sheets:[]};
  const sheetMap=new Map();
  filtered.forEach(h=>{
    const customer=h.customer||"（客先不明）";
    const cd=resolveClosingDay(customer);
    const bm=getBillingMonthFromDate(h.deliveryDate,cd);
    if(!bm)return;
    const key=customer+"\0"+bm.year+"\0"+bm.month;
    if(!sheetMap.has(key))sheetMap.set(key,{customer,year:bm.year,month:bm.month,invoices:[]});
    sheetMap.get(key).invoices.push(h);
  });
  const sheets=[];
  sheetMap.forEach(({customer,year,month,invoices})=>{
    invoices.sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));
    sheets.push(...collectMeisaiSheets(customer,invoices,year,month));
  });
  return {sheets};
}
function gatherClosingMeisaiSheets(){
  const custEl=document.getElementById("export-cust");
  const monthEl=document.getElementById("export-month");
  if(!monthEl||!monthEl.value)return {error:"年月を選択してください",sheets:[]};
  const [yrStr,moStr]=monthEl.value.split("-");
  const baseYear=parseInt(yrStr), baseMonth=parseInt(moStr);
  const selCust=custEl?custEl.value:"";
  let targets=state.customers.filter(c=>state.closingDays[c.name]!==undefined&&state.closingDays[c.name]!=="");
  if(selCust)targets=targets.filter(c=>c.name===selCust);
  if(!targets.length)return {error:"締め日が設定された客先がありません",sheets:[]};
  const sheets=[];
  targets.forEach(cust=>{
    const closingDay=state.closingDays[cust.name];
    const {from,to}=getClosingPeriod(closingDay,baseYear,baseMonth);
    const invoices=state.history.filter(h=>isRealInvoice(h)&&h.customer===cust.name&&dateInRange(h.deliveryDate,from,to));
    if(!invoices.length)return;
    invoices.sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));
    sheets.push(...collectMeisaiSheets(cust.name,invoices,baseYear,baseMonth));
  });
  if(!sheets.length)return {error:"該当期間に発行履歴がありません",sheets:[]};
  return {sheets};
}
function renderMeisaiSheetHtml(data){
  const invoices=(data.invoices||[]).slice(0,14);
  const itemMap=new Map();
  const order=[];
  let truncated=false;
  invoices.forEach((inv,i)=>{
    (inv.items||[]).forEach(it=>{
      const key=it.name+"|"+it.price;
      if(!itemMap.has(key)){
        if(order.length>=MEISAI_MAX_ITEM_ROWS){truncated=true;return;}
        itemMap.set(key,{name:it.name,price:it.price,qtys:Array(14).fill(0)});order.push(key);
      }
      itemMap.get(key).qtys[i]+=it.qty;
    });
  });
  const rows=order.map(k=>{
    const r=itemMap.get(k);
    const qtySum=r.qtys.reduce((s,q)=>s+q,0);
    return {...r,qtySum,amount:r.price*qtySum};
  });
  const sub=rows.reduce((s,r)=>s+r.amount,0);

// 未反映の伝票を請求月シートにまとめて書き出し（プリームスと同じ運用）
async function exportUnexportedExcel(){
  const toMark=pendingBillingInvoices();
  if(!toMark.length){showToast("未反映の伝票がありません","error");return;}
  if(!confirm("未反映 "+toMark.length+"件 を請求明細に反映してExcel出力します。\n\n※ 明細書には、同じ請求月の反映済み伝票も含めて月全体が載ります（正式な請求明細のため）。\n※ 「反映済み」になるのは今回の未反映分だけです。\n\n誤って押した場合は、あとから「反映を取り消す」で未反映に戻せます。"))return;
  const sheetMap=new Map();
  toMark.forEach(h=>{
    const cd=resolveClosingDay(h.customer);
    const bm=getBillingMonthFromDate(h.deliveryDate,cd);
    if(!bm)return;
    const customer=h.customer||"（客先不明）";
    const key=customer+"\0"+bm.year+"\0"+bm.month;
    if(!sheetMap.has(key))sheetMap.set(key,{customer,year:bm.year,month:bm.month,closingDay:cd});
  });
  const sheets=[];
  sheetMap.forEach(({customer,year,month,closingDay})=>{
    const {from,to}=getClosingPeriod(closingDay,year,month);
    const invoices=state.history.filter(h=>isRealInvoice(h)&&h.customer===customer&&dateInRange(h.deliveryDate,from,to));
    invoices.sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));
    if(!invoices.length)return;
    sheets.push(...collectMeisaiSheets(customer,invoices,year,month));
  });
  if(!sheets.length){showToast("該当期間に発行履歴がありません","error");return;}
  if(!confirmMeisaiOverflow(sheets))return;
  const d=new Date();
  const fname=`請求明細書_${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日.xlsx`;
  const ok=await exportMeisaiWorkbook(sheets,fname);
  if(!ok)return;
  const now=new Date().toISOString();
  toMark.forEach(h=>{h.billingExportedAt=now;});
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history);
    showToast(`${fname} をダウンロードしました（${sheets.length}シート）`);
  }catch(e){
    console.error("反映済み保存エラー",e);
    toMark.forEach(h=>{delete h.billingExportedAt;});
    showToast("Excelは出力しましたが、反映済みの保存に失敗しました。未反映のままです","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}

// 明細書Excel用JSONを書き出す
// 締め日ごとに客先別・期間別で集計したデータを出力
function exportMeisaiJson() {
  const today = new Date();
  const todayDay = today.getDate();

  // 客先ごとに「どの請求月に属するか」を自動判定して集計
  const meisaiData = [];

  state.customers.forEach(cust => {
    const closingDay = state.closingDays[cust.name];

    // 締め日から請求対象期間を計算
    // 締め日未設定 → 当月1日〜末日
    let from, to, billingYear, billingMonth;
    const cd = (closingDay !== undefined && closingDay !== "") ? closingDay : 0;

    if (cd === 0) {
      // 月末締め: 当月1日〜当月末日
      billingYear  = today.getFullYear();
      billingMonth = today.getMonth() + 1;
      from = new Date(billingYear, billingMonth - 1, 1);
      to   = new Date(billingYear, billingMonth, 0);
    } else {
      // N日締め: 今日が締め日以前 → 当月締め期間 / 締め日を過ぎた → 翌月締め期間
      if (todayDay <= cd) {
        // 当月締め期間: 前月(cd+1)日 〜 今月cd日
        billingYear  = today.getFullYear();
        billingMonth = today.getMonth() + 1;
      } else {
        // 翌月締め期間: 今月(cd+1)日 〜 来月cd日
        const next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        billingYear  = next.getFullYear();
        billingMonth = next.getMonth() + 1;
      }
      from = new Date(billingYear, billingMonth - 2, cd + 1);
      to   = new Date(billingYear, billingMonth - 1, cd);
    }

    const invoices = state.history.filter(h =>
      isRealInvoice(h) && h.customer === cust.name && dateInRange(h.deliveryDate, from, to)
    );
    if (invoices.length === 0) return;

    invoices.sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate));

    // シート名: 客先名_YYYY年M月
    const sheetName = cust.name + "_" + billingYear + "年" + billingMonth + "月";

    meisaiData.push({
      customer:    cust.name,
      sheetName:   sheetName,
      year:        billingYear,
      month:       billingMonth,
      closingDay:  cd,
      periodFrom:  fmtDate(from),
      periodTo:    fmtDate(to),
      invoices: invoices.map(inv => ({
        invoiceNo:    inv.invoiceNo || "",
        deliveryDate: fmtDate(new Date(inv.deliveryDate)),
        items: (inv.items || []).map(it => ({
          name:  it.name  || "",
          price: it.price || 0,
          qty:   parseFloat(it.qty) || 0
        })).filter(it => it.name && it.qty > 0)
      }))
    });
  });

  if (meisaiData.length === 0) {
    showToast("現在の締め期間に発行履歴がありません", "error");
    return;
  }

  const output = {
    exportDate: new Date().toISOString(),
    meisaiData
  };

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `明細書データ_${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日.json`;
  a.click();

  // 書き出し内容のサマリーをトーストで表示
  const summary = meisaiData.map(d => d.sheetName + "（" + d.invoices.length + "件）").join("、");
  showToast("書き出し完了：" + summary);
}

const _guideOpen=new Set(); // 初期はすべて折りたたみ
let _guideUserUnlocked=false;

function toggleGuideSection(id,needsAdmin){
  if(_guideOpen.has(id)){
    _guideOpen.delete(id);
    render();
    return;
  }
  if(needsAdmin&&!_guideUserUnlocked){
    const pass=prompt("管理者パスワードを入力してください");
    if(pass===null)return;
    if(pass!==_userTabAdminPass){alert("パスワードが違います");return;}
    _guideUserUnlocked=true;
  }
  _guideOpen.add(id);
  render();
}
window.toggleGuideSection=toggleGuideSection;

function guideAcc(id,title,bodyHtml,needsAdmin){
  const open=_guideOpen.has(id);

  return`<div class="guide-acc${open?" open":""}">

    </button>
    <div class="guide-acc-body">${bodyHtml}</div>
  </div>`;
}

// --- Print Modal ---

function renderPrintModal(directPrint){
  const inv=state.printInvoice;if(!inv)return;
  const modal=document.getElementById("print-modal");
  const displayItems=inv.items.filter(i=>i.isDeliverySite||parseFloat(i.qty)>0);
  const maxRows=11;
  const bdr="1px solid #000";
  const isMulti=displayItems.length>maxRows;

  // 1ページ分のHTMLを生成（items・showTotal・showBiko・pageLabel・isCtrl）
  function calcCustomerFontSize(name){
    const len=(name||"").length;
    if(len<=18)return 17;
    if(len<=30)return 15;
    if(len<=42)return 13.5;
    if(len<=60)return 12;
    return 10.5;
  }
  function block(items,showTotal,showBiko,pageLabel,isCtrl){
    const padded=[...items];
    const rows_n=isMulti?maxRows:maxRows;
    while(padded.length<rows_n)padded.push(null);
    const subtotal=items.filter(i=>!i.isDeliverySite).reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.price)||0),0);
    const rows=padded.map(item=>`<tr style="height:9mm"><td style="border:${bdr};padding:0px 5px;font-size:12.5px">${item?item.name:"\u00a0"}</td><td style="border:${bdr};padding:0px 4px;text-align:center;font-size:12.5px;width:44px">${item?item.qty:""}</td><td style="border:${bdr};padding:0px 4px;text-align:right;font-size:12.5px;width:58px">${item?item.price.toLocaleString():""}</td><td style="border:${bdr};padding:0px 4px;text-align:right;font-size:12.5px;width:68px">${item?(parseInt(item.qty)*item.price).toLocaleString():""}</td></tr>`).join("");
    const totalVal=showTotal?Math.max(subtotal,inv.minGuarantee||0):null;
    return`<div style="flex:1;min-width:0;padding:0 3px;font-family:'MS Mincho',serif;display:flex;flex-direction:column;height:100%">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px">
        <div style="font-size:22px;font-weight:700">${isCtrl?"受領書":"納品書"}${pageLabel?`<span style="font-size:13px;margin-left:8px">${pageLabel}</span>`:""}</div>
        <div style="font-size:15px">\u00a0\u00a0 № ${inv.invoiceNo}</div>
      </div>
      <div style="border:${bdr};padding:0 8px;margin-bottom:2px;height:15mm;position:relative"><span style="font-size:${calcCustomerFontSize(inv.customer)}px;font-weight:700;white-space:normal;word-break:break-word;line-height:1.12;display:block;padding-right:92px;padding-top:2px">${inv.customer}</span><span style="position:absolute;top:2px;right:8px;white-space:nowrap;font-size:${calcCustomerFontSize(inv.customer)}px;font-weight:700">様</span><span style="position:absolute;right:8px;bottom:3px;font-size:11px;color:#333;white-space:nowrap">納品日　<strong style="font-size:13px">${fmtDate(inv.deliveryDate)}</strong></span></div>
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;height:105mm">
        <thead><tr>
          <th style="border:${bdr};padding:3px 6px;text-align:center;background:#f0f0f0;font-size:12px">品\u3000名</th>
          <th style="border:${bdr};padding:3px 4px;width:63px;text-align:center;background:#f0f0f0;font-size:12px">数量</th>
          <th style="border:${bdr};padding:3px 4px;width:58px;text-align:center;background:#f0f0f0;font-size:12px">単\u3000価</th>
          <th style="border:${bdr};padding:3px 4px;width:87px;text-align:center;background:#f0f0f0;font-size:12px">金\u3000額</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="display:flex;align-items:center;border:${bdr};border-top:2px solid #000;margin-top:-1px">
        <div style="flex:1;text-align:right;padding:3px 8px;font-size:11px;white-space:nowrap">${showTotal?"税抜き価格です":"\u00a0"}</div>
        <div style="border-left:${bdr};padding:3px 8px;font-size:11px;display:flex;align-items:center">${showTotal?"合\u3000計":"小\u3000計"}</div>
        <div style="padding:3px 10px;font-size:16px;font-weight:700;min-width:85px;text-align:right">¥${showTotal?totalVal.toLocaleString():subtotal.toLocaleString()}</div>
      </div>
      ${showTotal&&inv.minGuarantee>0&&inv.subtotal<inv.minGuarantee?`<div style="font-size:10px;color:#888;text-align:right">（最低保証 ¥${inv.minGuarantee.toLocaleString()} 適用）</div>`:""}
      ${showBiko?`<div style="border:${bdr};border-top:none;flex-shrink:0;min-height:59px;padding:2px 6px;margin-top:-1px"><div style="font-size:10px;color:#555;margin-bottom:1px">備\u3000考</div><div style="font-size:11.5px;line-height:1.5;white-space:pre-wrap">${inv.memo||"\u00a0"}</div></div>`:""}
      <div style="display:flex;justify-content:space-between;border:${bdr};border-top:none;height:19mm;margin-top:-1px">
        ${isCtrl?`<div style="border-right:${bdr};min-width:17mm;width:17mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px"><span style="font-size:9px">受領印</span></div>`:""}
        <div style="padding:2px 8px 2px 0;font-size:10.5px;line-height:1.3;text-align:right;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;justify-content:center;letter-spacing:-0.03em;flex:1">
          <div style="font-weight:700;font-size:12px"><span style="font-size:13px">${COMPANY.name}</span><span style="font-size:9.5px">${COMPANY.division}</span></div>
          <div>${COMPANY.zip}${COMPANY.address}</div>
          <div>${COMPANY.tel}　${COMPANY.fax}</div>
        </div>
      </div>
    </div>`;
  }

  // ページ分割
  const pages=[];
  if(!isMulti){
    pages.push({items:displayItems,showTotal:true,showBiko:true,label:""});
  } else {
    for(let i=0;i<displayItems.length;i+=maxRows){
      const chunk=displayItems.slice(i,i+maxRows);
      const isLast=i+maxRows>=displayItems.length;
      const pg=Math.floor(i/maxRows)+1;
      const total=Math.ceil(displayItems.length/maxRows);
      pages.push({items:chunk,showTotal:isLast,showBiko:isLast,label:`(${pg}/${total})`});
    }
  }

  const div=s=>`<div style="width:20px;min-width:20px;display:flex;align-items:center;justify-content:center"><div style="border-left:1px dashed #aaa;height:100%"></div></div>`;

  // プレビュー用HTML
  const previewHtml=pages.map((p,pi)=>`
    ${pi>0?`<div style="margin-top:24px;border-top:2px dashed #ccc;padding-top:16px;font-size:12px;color:#888;text-align:center">── 2枚目 ──</div>`:""}
    <div style="display:flex;gap:0;background:#fff;width:100%;box-sizing:border-box">
      ${block(p.items,p.showTotal,p.showBiko,p.label,false)}
      ${div()}
      ${block(p.items,p.showTotal,p.showBiko,p.label,true)}
    </div>`).join("");

  // 印刷用HTML（print-area）
  const printHtml=pages.map((p,pi)=>`
    <div class="slot">${block(p.items,p.showTotal,p.showBiko,p.label,false)}</div>
    <div class="dv"><div style="border-left:1px dashed #aaa;height:100%"></div></div>
    <div class="slot">${block(p.items,p.showTotal,p.showBiko,p.label,true)}</div>
    `).join("");

  // print-area をbody直下に設置
  let pa=document.getElementById("print-area");
  if(!pa){pa=document.createElement("div");pa.id="print-area";document.body.appendChild(pa);}
  pa.innerHTML=printHtml;

  // プレビューを省略して直接ブラウザの印刷ダイアログを開く
  if(directPrint){doPrint();return;}

  modal.classList.remove("hidden");

  </div>`;
}
function downloadCSV(inv){
  if(!inv)return;
  var BOM="\uFEFF";
  var header=["納品日","客先名","品名","数量","単価","金額","合計金額","備考"];
  var rows=inv.items.map(function(item,i){
    return [
      fmtDate(inv.deliveryDate),
      inv.customer,
      item.name,
      item.qty,
      item.price,
      parseInt(item.qty)*item.price,
      i===0?inv.total:"",
      i===0?(inv.memo||""):""
    ];
  });
  function esc(v){
    var s=String(v!==null&&v!==undefined?v:"");
    return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  var lines=[header].concat(rows).map(function(r){return r.map(esc).join(",");});
  var csv=BOM+lines.join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  var d=fmtDate(inv.deliveryDate).replace(/\//g,"");
  a.href=url;
  a.download="納品書_"+inv.invoiceNo+"_"+d+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSVをダウンロードしました");
}
function doPrint(){

  const inner=pa.innerHTML;
  const css=''
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'@page{size:257mm 168mm landscape;margin:0}'
    +'html,body{margin:0;padding:0;width:257mm;height:168mm;overflow:hidden;background:#fff;-webkit-print-color-adjust:exact;font-family:"MS Mincho",serif}'
    +'.wrap{position:absolute;top:0;left:0;width:257mm;height:168mm;overflow:hidden}'
    +'.inner{position:absolute;top:0;left:0;width:257mm;height:168mm;transform:translate(10.3mm,9.7mm) scale(0.92);transform-origin:top left;display:flex}'
    +'.slot{flex:1;min-width:0;max-width:calc(50% - 10px);padding:1mm 3mm}'

    +'<body><div class="wrap"><div class="inner">'+inner+'</div></div></body></html>';
  const ifr=document.createElement("iframe");
  ifr.style.cssText="position:fixed;top:-9999px;left:-9999px;width:257mm;height:168mm;border:none;";

function getUnissuedAlerts(){
  const today=new Date();
  const isSunday=d=>d.getDay()===0;
  // 前の稼働日（日曜は完全休みなのでスキップ）
  const prevDay=new Date(today);
  do{prevDay.setDate(prevDay.getDate()-1);}while(isSunday(prevDay));
  // 次の稼働日（日曜は完全休みなのでスキップ）
  const nextDay=new Date(today);
  do{nextDay.setDate(nextDay.getDate()+1);}while(isSunday(nextDay));
  // 対象は「前の稼働日・本日・次の稼働日」。本日が日曜なら本日は除外
  const targets=[prevDay];
  if(!isSunday(today))targets.push(today);
  targets.push(nextDay);
  const result=[];
  state.customers.forEach(c=>{
    const cycle=getCycleForCustomer(c.name);
    if(!cycle)return;
    targets.forEach(dt=>{
      if(isSunday(dt))return; // 日曜はカウントしない
      if(!isDeliveryDay(c.name,dt))return;
      // この日付に発行済みか確認
      const dateStr=toInput(dt);
      if(isUnissuedNone(c.name,dateStr))return;
      const issued=state.history.some(h=>{
        if(h.void)return false;
        if(h.customer!==c.name)return false;
        const hDate=historyDeliveryKey(h);
        return hDate===dateStr;
      });
      if(!issued){
        const todayStr=toInput(today);
        const label=dateStr===todayStr?"本日":dateStr<todayStr?"昨日":"明日";
        result.push({customer:c.name,date:dt,dateStr,label,dayName:DAY_NAMES[dt.getDay()]});
      }
    });
  });
  const seen=new Set();
  return result.filter(r=>{
    const key=r.customer+r.dateStr;
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
}

function unissuedNoneKey(customer,dateStr){return customer+"\t"+dateStr;}
function isUnissuedNone(customer,dateStr){
  if(!state.unissuedNone)return false;
  return !!state.unissuedNone[unissuedNoneKey(customer,dateStr)];
}
function pruneUnissuedNone(){
  if(!state.unissuedNone)return;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-14);
  const cut=toInput(cutoff);
  Object.keys(state.unissuedNone).forEach(k=>{
    const dateStr=k.split("\t")[1]||"";
    if(dateStr&&dateStr<cut)delete state.unissuedNone[k];
  });
}
async function markUnissuedNone(customer,dateStr){
  try{
    if(!customer||!dateStr){showToast("客先または日付が不正です","error");return;}
    const dateLabel=fmtDate(fromInput(dateStr)||dateStr);
    if(!confirm(`${customer}\n納品日 ${dateLabel} を「発行なし」にしますか？\n未発行一覧から外れ、発行履歴に残ります。`))return;
    const already=state.history.some(h=>{
      if(h.void)return false;
      if(h.customer!==customer)return false;
      return historyDeliveryKey(h)===dateStr;
    });
    if(already){showToast("この納品日はすでに履歴にあります","error");return;}
    let id=Date.now();
    while(state.history.some(h=>h.id===id))id++;
    const rec={
      id,
      invoiceNo:"発行なし",
      customer,
      deliveryDate:fromInput(dateStr),
      issueDate:new Date(),
      items:[],
      subtotal:0,
      minGuarantee:0,
      total:0,
      memo:"発行なし",
      deliverySite:"",
      issuedBy:window._userShortId||"",
      issuedByName:window._userDisplayName||"",
      issueNone:true
    };
    state.history.unshift(rec);
    if(!state.unissuedNone)state.unissuedNone={};
    state.unissuedNone[unissuedNoneKey(customer,dateStr)]=true;
    pruneUnissuedNone();
    render();
    window._issuingInvoice=true;
    try{
      await saveHistoryMerged(state.history);
      save("pv_unissued_none",state.unissuedNone);
      showToast("発行なしを履歴に残しました");
    }catch(e){
      console.error("発行なし履歴保存エラー",e);
      state.history=state.history.filter(h=>h.id!==rec.id);
      delete state.unissuedNone[unissuedNoneKey(customer,dateStr)];
      showToast("履歴の保存に失敗しました","error");
      render();
    }finally{
      setTimeout(()=>{window._issuingInvoice=false;},2000);
    }
  }catch(e){
    console.error("markUnissuedNone",e);
    alert("発行なしの処理でエラー："+(e.message||e));
  }
}
async function cancelIssueNone(id){
  const rec=state.history.find(h=>h.id===id);
  if(!rec||!isIssueNone(rec))return;
  if(!confirm("「発行なし」を取り消しますか？未発行一覧に戻ります。"))return;
  const dateStr=historyDeliveryKey(rec);
  state.history=state.history.filter(h=>h.id!==id);
  if(state.unissuedNone)delete state.unissuedNone[unissuedNoneKey(rec.customer,dateStr)];
  window._issuingInvoice=true;
  try{
    await saveHistoryMerged(state.history,{deletedIds:[id]});
    save("pv_unissued_none",state.unissuedNone||{});
    showToast("発行なしを取り消しました");
  }catch(e){
    console.error("発行なし取消エラー",e);
    state.history.unshift(rec);
    if(dateStr){
      if(!state.unissuedNone)state.unissuedNone={};
      state.unissuedNone[unissuedNoneKey(rec.customer,dateStr)]=true;
    }
    showToast("保存に失敗しました。発行なしのままです","error");
  }finally{
    setTimeout(()=>{window._issuingInvoice=false;},2000);
  }
  render();
}
window.markUnissuedNone=markUnissuedNone;

function selectCustomerFromSidebar(customerName,dateStr){

async function bootApp(){

  try{

  }catch(e){

    window._appStarted=false;
    const errEl=document.getElementById("login-error");
    if(errEl){
      errEl.style.color="#c62828";
      errEl.textContent="起動エラー："+(e.message||"不明なエラー");
    }
    showLoginScreen();
  }finally{

  }

async function doLogin(){
  const password=document.getElementById("login-password").value;
  const errEl=document.getElementById("login-error");
  errEl.textContent="";
  errEl.style.color="#c62828";
  if(!password){errEl.textContent="パスワードを入力してください";return;}
  window._manualLoginInProgress=true;
  try{
    let retries=0;
    while(typeof window._getUserProfiles!=="function"&&retries<20){
      await new Promise(r=>setTimeout(r,200));
      retries++;
    }
    const profiles=await window._getUserProfiles().catch(()=>[]);
    if(!profiles||profiles.length===0){
      errEl.textContent="ユーザー情報を取得できません。しばらく待ってから再試行してください。";
      return;
    }
    // 前回成功した略称IDを先に試し、不要な失敗回数を減らす
    let ordered=[...profiles];
    try{
      const last=(localStorage.getItem("pv_last_shortid")||"").toUpperCase();
      if(last){
        ordered.sort((a,b)=>{
          const as=(a.shortId||"").toUpperCase()===last?0:1;
          const bs=(b.shortId||"").toUpperCase()===last?0:1;
          return as-bs;
        });
      }
    }catch{}
    let loggedIn=false;
    let rateLimited=false;
    for(const prof of ordered){
      if(rateLimited)break;
      const email=prof.email||(prof.shortId
        ? prof.shortId.toLowerCase()+"@pv.local"
        : "");
      if(!email) continue;
      try{
        const cred=await window._signIn(email,password);
        const user=cred.user;
        setUserProfile(prof,email);
        try{if(prof.shortId)localStorage.setItem("pv_last_shortid",String(prof.shortId).toUpperCase());}catch{}
        if(prof.shortId!=="AD") await window._saveLoginLog(user.uid,email,window._userDisplayName);
        loggedIn=true;
        break;
      }catch(e){
        if(e.code==="auth/too-many-requests"){
          errEl.textContent="ログイン試行が多すぎます。しばらく待ってから再試行してください。";
          rateLimited=true;
          break;
        }
        continue;
      }
    }
    if(!loggedIn&&!rateLimited){errEl.textContent="パスワードが正しくありません";}
    else if(loggedIn)await bootApp();
  }catch(e){
    console.error("Login error:",e.code,e.message);
    errEl.textContent="エラー："+(e.code||e.message||"不明なエラー");
  }finally{
    window._manualLoginInProgress=false;
  }
}
async function doLogout(){
  if(!confirm("ログアウトしますか？"))return;
  await window._signOut();
  window._appStarted=false;
  window._booting=false;
  window._manualLoginInProgress=false;
  window._userShortId="";
  window._userDisplayName="";
  showLoginScreen();
}

async function checkDataTabPass(){

  for(const prof of profiles){
    if(rateLimited)break;

      ? prof.shortId.toLowerCase()+"@pv.local"
      : "");
    if(!email) continue;
    try{

        errEl.textContent="試行回数が多すぎます。しばらく待ってください。";

    renderDataTab();
  }else if(!rateLimited){
    errEl.textContent="パスワードが違います";
  }
}

async function uploadToGitHub(){

  if(!fileInput||!fileInput.files||fileInput.files.length===0){

    }else{

    }

  }finally{

window._autoUploadToGitHub = async function(htmlContent) {
  try{
    // FirestoreからPATを取得
    const patSnap = await window._fsLoad("pv_githubPAT");
    if(!patSnap){
      console.warn("GitHub PATが見つかりません");
      return false;
    }
    const pat = typeof patSnap === "string" ? patSnap : String(patSnap);
    const owner = "pv-dn";
    const repo = "pourvoussystem";
    const path = "index.html";
    const branch = "main";

    // 現在のファイルのSHAを取得（更新に必要）
    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      headers: {
        "Authorization": `token ${pat}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });
    if(!getRes.ok){
      console.error("GitHub GET error", getRes.status);
      return false;
    }
    const getJson = await getRes.json();
    const sha = getJson.sha;

    // ファイルをBase64エンコード
    const encoded = btoa(unescape(encodeURIComponent(htmlContent)));

    // GitHubにPUT
    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${pat}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `自動更新 ${new Date().toLocaleString("ja-JP")}`,
        content: encoded,
        sha: sha,
        branch: branch
      })
    });

    if(putRes.ok){
      console.log("GitHub自動アップロード成功");
      return true;
    } else {
      console.error("GitHub PUT error", putRes.status);
      return false;
    }
  }catch(e){
    console.error("GitHub自動アップロードエラー", e);
    return false;
  }
};

let _statsView="monthly";
let _statsYear=new Date().getFullYear();
let _statsRankMonth=null; // null=全年, 0〜11=その月
let _statsCharts={};

function getValidHistory(){
  return state.history.filter(h=>isRealInvoice(h)&&h.total>0);
}

function getAvailableYears(){
  const years=new Set();
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(!isNaN(d))years.add(d.getFullYear());
  });
  const arr=[...years].sort((a,b)=>b-a);
  if(arr.length===0)arr.push(new Date().getFullYear());
  return arr;
}

function aggregateMonthlyTotal(year){
  const months=Array(12).fill(0);
  const counts=Array(12).fill(0);
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    months[d.getMonth()]+=h.total;
    counts[d.getMonth()]++;
  });
  return{months,counts};
}

function aggregateMonthlyByCustomer(year){
  const map={};
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    const m=d.getMonth();
    if(!map[h.customer])map[h.customer]=Array(12).fill(0);
    map[h.customer][m]+=h.total;
  });
  return map;
}

function aggregateCustomerRanking(year,month){
  const map={};
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    if(month!==null&&month!==undefined&&d.getMonth()!==month)return;
    map[h.customer]=(map[h.customer]||0)+h.total;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function aggregateYTDCumulative(year){
  const data=aggregateMonthlyTotal(year);
  const cumulative=[];
  let sum=0;
  const now=new Date();
  const currentMonth=(year===now.getFullYear())?now.getMonth():11;
  for(let i=0;i<=currentMonth;i++){
    sum+=data.months[i];
    cumulative.push(sum);
  }
  return cumulative;
}
