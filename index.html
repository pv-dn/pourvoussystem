<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プゥル・ヴー 納品書発行システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRvXOmLV_iU9ybzJrquJSglUYfEON_CsM",
  authDomain: "pourvoussystem.firebaseapp.com",
  projectId: "pourvoussystem",
  storageBucket: "pourvoussystem.firebasestorage.app",
  messagingSenderId: "505648740877",
  appId: "1:505648740877:web:f5b0c3a950866ce74bb344"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window._db = db;
window._auth = auth;

// ログイン・ログアウト関数
window._signIn = async function(email, password) {
  return await signInWithEmailAndPassword(auth, email, password);
};
window._signOut = async function() {
  return await signOut(auth);
};
window._createUser = async function(email, password) {
  return await createUserWithEmailAndPassword(auth, email, password);
};
window._updateUserPassword = async function(user, newPassword) {
  return await updatePassword(user, newPassword);
};
// 管理者用：別セッションでユーザーを再作成してパスワードを付け直す
window._resetUserPassword = async function(shortId, displayName, newPassword, oldUid) {
  const secondary = initializeApp(firebaseConfig, "pv-reset-" + Date.now());
  try {
    const secondaryAuth = getAuth(secondary);
    const base = String(shortId || "user").toLowerCase().replace(/[^a-z0-9]/g, "") || "user";
    // 既存 ey@pv.local が残っていても再設定できるよう、一意なメールで新規作成する
    const email = base + "_r" + Date.now().toString(36) + "@pv.local";
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, newPassword);
    const newUid = cred.user.uid;
    await setDoc(doc(db, "userProfiles", newUid), {
      email, shortId, displayName: displayName || ""
    }, { merge: true });
    if (oldUid && oldUid !== newUid) {
      try {
        const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
        await deleteDoc(doc(db, "userProfiles", oldUid));
      } catch (_) {}
    }
    await signOut(secondaryAuth);
    return { newUid, email };
  } finally {
    try { await deleteApp(secondary); } catch (_) {}
  }
};

// ログイン履歴を保存
window._saveLoginLog = async function(uid, email, displayName) {
  try {
    await addDoc(collection(db, "loginLogs"), {
      uid, email, displayName: displayName||"",
      loginAt: new Date().toISOString()
    });
  } catch(e) { console.warn("login log error", e); }
};

// ログイン履歴を取得
window._getLoginLogs = async function(n) {
  try {
    const q = query(collection(db, "loginLogs"), orderBy("loginAt","desc"), limit(n||50));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
};

// ユーザー情報をFirestoreに保存（displayName・shortId管理）
window._saveUserProfile = async function(uid, data) {
  await setDoc(doc(db, "userProfiles", uid), data, {merge:true});
};
window._getUserProfiles = async function() {
  try {
    const snap = await getDocs(collection(db, "userProfiles"));
    return snap.docs.map(d => ({uid: d.id, ...d.data()}));
  } catch(e) { return []; }
};


// 認証状態の監視
onAuthStateChanged(auth, (user) => {
  window._currentUser = user;
  if (!user) {
    window._appStarted = false;
    window._booting = false;
    if (typeof window.showLoginScreen === "function") window.showLoginScreen();
  } else if (!window._manualLoginInProgress && typeof window.bootApp === "function") {
    window.bootApp();
  }
});

const FS_KEYS = {
  pv_customers: "customers",
  pv_products: "products",
  pv_prices: "prices",
  pv_history: "history",
  pv_invoice_counters: "invoiceCounters",
  pv_closing_days: "closingDays",
  pv_min: "minG",
  pv_cycles: "cycles",
  pv_skip_holidays: "skipHolidays",
  pv_unissued_none: "unissuedNone",
  pv_data_edit_logs: "dataEditLogs",
  pv_adminpass: "adminpass",
  pv_githubPAT: "githubPAT"
};

window._fsSave = async function(k, v) {
  const fsKey = FS_KEYS[k];
  if (!fsKey) return;
  try {
    await setDoc(doc(db, "pvdata", fsKey), { value: JSON.stringify(v) });
  } catch(e) { console.warn("Firestore save error", e); }
};

window._fsLoad = async function(k) {
  const fsKey = FS_KEYS[k];
  if (!fsKey) return null;
  try {
    const snap = await getDoc(doc(db, "pvdata", fsKey));
    if (snap.exists()) { const raw=snap.data().value; try{return JSON.parse(raw);}catch{return raw;} }
  } catch(e) { console.warn("Firestore load error", e); }
  return null;
};

// リアルタイム同期（ログイン後に開始）
const watchKeys = ["customers","products","prices","history","invoiceCounters","closingDays","minG","cycles","skipHolidays","unissuedNone","dataEditLogs"];
window._startRealtimeSync = function() {
if(window._realtimeSyncStarted)return;
window._realtimeSyncStarted=true;
watchKeys.forEach(fsKey => {
  const localKey = Object.keys(FS_KEYS).find(k => FS_KEYS[k] === fsKey);
  onSnapshot(doc(db, "pvdata", fsKey), (snap) => {
    if (!snap.exists()) return;
    try {
      const val = JSON.parse(snap.data().value);
      try { localStorage.setItem(localKey, JSON.stringify(val)); } catch{}
      const st = window._state;
      if (st) {
        if (localKey === "pv_customers") st.customers = val;
        else if (localKey === "pv_products") st.products = val;
        else if (localKey === "pv_prices") st.prices = val;
        else if (localKey === "pv_history") {
          // 発行処理中は自分の書き込みによるonSnapshotで上書きしない
          if (!window._issuingInvoice) st.history = val;
        }
        else if (localKey === "pv_invoice_counters") st.invoiceCounters = val;
        else if (localKey === "pv_closing_days") st.closingDays = val;
        else if (localKey === "pv_min") st.minG = val;
        else if (localKey === "pv_cycles") mergeCycles(val);
        else if (localKey === "pv_skip_holidays") st.skipHolidays = val;
        else if (localKey === "pv_unissued_none") st.unissuedNone = val;
        else if (localKey === "pv_data_edit_logs") st.dataEditLogs = Array.isArray(val)?val:[];
      }
      if (st && !st.showPrint && !st.editingHistory && !st.customerDetail && typeof render === "function") {
        render();
      }
    } catch(e) { console.warn("Firestore sync error", e); }
  });
});
}; // end _startRealtimeSync

// 初回起動：Firestoreから最新データをlocalStorageへ同期（ログイン後に実行）
window._startFirestoreSync = async function() {
  window._fsInitPromise = Promise.all(watchKeys.map(async fsKey => {
    const localKey = Object.keys(FS_KEYS).find(k => FS_KEYS[k] === fsKey);
    const val = await window._fsLoad(localKey);
    if (val !== null) {
      try { localStorage.setItem(localKey, JSON.stringify(val)); } catch{}
      // DELIVERY_CYCLESも初回ロード時に反映
      if(localKey === "pv_cycles" && typeof DELIVERY_CYCLES !== "undefined") {
        try { mergeCycles(val); } catch{}
      }
    }
  }));
  window._startRealtimeSync();
  return window._fsInitPromise;
};
</script>
<style>

const DEFAULT_QTY_TIERS=()=>[{min:1,max:null,price:0}];
function hasQtyTiers(rec){return rec&&Array.isArray(rec.qtyTiers)&&rec.qtyTiers.length>0;}
function resolveUnitPrice(rec,qty){
  const q=parseFloat(qty)||0;
  if(!hasQtyTiers(rec))return parseFloat(rec?.price)||0;
  if(q<=0)return rec.qtyTiers[0].price;
  for(const t of rec.qtyTiers){
    const min=t.min??1;
    const max=t.max==null?Infinity:t.max;
    if(q>=min&&q<=max)return t.price;
  }
  return rec.qtyTiers[rec.qtyTiers.length-1].price;
}
function formatTierLabel(rec){
  if(!hasQtyTiers(rec))return"";
  return rec.qtyTiers.map(t=>{
    const maxLabel=t.max==null?`${t.min}枚〜`:`${t.min}〜${t.max}枚`;
    return `${maxLabel}: ¥${t.price}`;
  }).join(" / ");
}
function findPriceRecord(customer,code){return state.prices.find(p=>p.customer===customer&&p.code===code);}
function normName(s){return(s||"").replace(/\s+/g,"");}
function mergeCycles(src){
  if(!src||typeof src!=="object")return;
  for(const k in src){const v=src[k];if(typeof v==="string"?v.trim():v)DELIVERY_CYCLES[k]=v;}
}
function getCycleForCustomer(name){
  if(DELIVERY_CYCLES[name])return DELIVERY_CYCLES[name];
  const n=normName(name);
  for(const k in DELIVERY_CYCLES){if(DELIVERY_CYCLES[k]&&normName(k)===n)return DELIVERY_CYCLES[k];}
  return "";
}
// デフォルトは祝日でも納品（skipHolidays[name]===true のときだけ祝日を飛ばす）
function skipsHolidays(name){
  if(!name||!state.skipHolidays)return false;
  if(state.skipHolidays[name]===true)return true;
  const n=normName(name);
  for(const k in state.skipHolidays){if(state.skipHolidays[k]===true&&normName(k)===n)return true;}
  return false;
}
function nthMonday(y,m,n){ // m:1-12, n:第n月曜
  const first=new Date(y,m-1,1);
  const firstMon=1+((8-first.getDay())%7);
  return firstMon+(n-1)*7;
}
function springEquinox(y){ // 春分の日（近似式）
  return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
}
function autumnEquinox(y){ // 秋分の日（近似式）
  return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
}
function japaneseHolidaySet(y){
  const set=new Set();
  const add=(m,d)=>set.add(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  // 固定祝日
  add(1,1);  // 元日
  add(2,11); // 建国記念の日
  if(y>=2020)add(2,23); // 天皇誕生日（2019年5月1日即位、2020〜2/23）
  add(4,29); // 昭和の日
  add(5,3);  // 憲法記念日
  add(5,4);  // みどりの日
  add(5,5);  // こどもの日
  if(y>=2016)add(8,11); // 山の日
  add(11,3); // 文化の日
  add(11,23);// 勤労感謝の日
  // ハッピーマンデー
  add(1,nthMonday(y,1,2)); // 成人の日
  if(y>=2003)add(7,nthMonday(y,7,3)); // 海の日（7月第3月曜）
  else add(7,20);
  add(9,nthMonday(y,9,3)); // 敬老の日
  if(y>=2020)add(10,nthMonday(y,10,2)); // スポーツの日
  else if(y>=2000)add(10,nthMonday(y,10,2)); // 体育の日
  else add(10,10);
  // 春分・秋分
  add(3,springEquinox(y));
  add(9,autumnEquinox(y));
  // 振替休日（日曜と重なった祝日の翌日以降、祝日でない日まで）
  const keys=[...set].sort();
  keys.forEach(k=>{
    const[yy,mm,dd]=k.split("-").map(Number);
    const d=new Date(yy,mm-1,dd);
    if(d.getDay()!==0)return;
    const n=new Date(d);
    do{n.setDate(n.getDate()+1);}while(set.has(toInput(n)));
    add(n.getMonth()+1,n.getDate());
  });
  // 国民の休日（祝日と祝日に挟まれた平日）
  const sorted=[...set].sort();
  for(let i=0;i<sorted.length-1;i++){
    const a=new Date(sorted[i]);
    const b=new Date(sorted[i+1]);
    const diff=(b-a)/86400000;
    if(diff===2){
      const mid=new Date(a);mid.setDate(a.getDate()+1);
      if(mid.getDay()!==0)add(mid.getMonth()+1,mid.getDate());
    }
  }
  return set;
}
const _holidayCache={};
function isJapaneseHoliday(d){
  if(!(d instanceof Date)||isNaN(d))return false;
  const y=d.getFullYear();
  if(!_holidayCache[y])_holidayCache[y]=japaneseHolidaySet(y);
  return _holidayCache[y].has(toInput(d));
}
function isDeliveryDay(name,d){
  const cycle=getCycleForCustomer(name);
  if(!cycle)return false;
  if(!cycle.includes(DAY_NAMES[d.getDay()]))return false;
  if(skipsHolidays(name)&&isJapaneseHoliday(d))return false;
  return true;
}
const SHAKO_YOKOHAMA_CUSTOMER="写光レンタル販売株式会社　横浜センター";
function renameCustomerData(oldName,newName){
  if(!oldName||!newName||oldName===newName)return;
  state.customers=state.customers.map(c=>c.name===oldName?{...c,name:newName}:c);
  if(state.minG[oldName]!==undefined){state.minG[newName]=state.minG[oldName];delete state.minG[oldName];}
  if(DELIVERY_CYCLES[oldName]!==undefined){DELIVERY_CYCLES[newName]=DELIVERY_CYCLES[oldName];delete DELIVERY_CYCLES[oldName];}
  if(state.closingDays[oldName]!==undefined){state.closingDays[newName]=state.closingDays[oldName];delete state.closingDays[oldName];}
  if(state.skipHolidays&&state.skipHolidays[oldName]!==undefined){state.skipHolidays[newName]=state.skipHolidays[oldName];delete state.skipHolidays[oldName];}
  state.prices=state.prices.map(p=>p.customer===oldName?{...p,customer:newName}:p);
  state.history=state.history.map(h=>h.customer===oldName?{...h,customer:newName}:h);
}
function applyShakoCustomerNameFix(){
  const c=state.customers.find(x=>x.id==="032")||state.customers.find(x=>{const n=normName(x.name);return n.includes("写光")&&n.includes("横浜");});
  if(!c||normName(c.name)===normName(SHAKO_YOKOHAMA_CUSTOMER))return;
  if(!normName(c.name).includes("写光"))return;
  const oldName=c.name;
  renameCustomerData(oldName,SHAKO_YOKOHAMA_CUSTOMER);
  save("pv_customers",state.customers);
  save("pv_min",state.minG);
  save("pv_closing_days",state.closingDays);
  save("pv_skip_holidays",state.skipHolidays||{});
  save("pv_prices",state.prices);
  save("pv_history",state.history);
  saveCycles();
  if(window._fsSave){
    window._fsSave("pv_customers",state.customers).catch(()=>{});
    window._fsSave("pv_min",state.minG).catch(()=>{});
    window._fsSave("pv_closing_days",state.closingDays).catch(()=>{});
    window._fsSave("pv_skip_holidays",state.skipHolidays||{}).catch(()=>{});
    window._fsSave("pv_prices",state.prices).catch(()=>{});
    window._fsSave("pv_history",state.history).catch(()=>{});
  }
}

function fmtDate(d){if(!d)return"";const dt=d instanceof Date?d:new Date(d);if(isNaN(dt))return"";return`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}`;}
function toInput(d){if(!d)return"";const dt=d instanceof Date?d:new Date(d);if(isNaN(dt))return"";return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;}
function fromInput(s){if(!s)return new Date();const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function nextDelivery(name){
  const cycle=getCycleForCustomer(name);
  if(!cycle)return new Date();
  const t=new Date();
  for(let i=1;i<=21;i++){
    const d=new Date(t);
    d.setDate(t.getDate()+i);
    if(isDeliveryDay(name,d))return d;
  }
  return new Date();
}
function nextInvoiceNo(custName){
  const prefix=(custName==="__FREE__")?"999":(()=>{const c=state.customers.find(x=>x.name===custName);return c?c.id:"999";})();
  const fromHistory=state.history.filter(h=>h.invoiceNo&&h.invoiceNo.startsWith(prefix+"-P")).map(h=>parseInt((h.invoiceNo.split("-P")[1])||0));
  const fromCounter=state.invoiceCounters[prefix]||0;
  // カウンターが履歴の最大値より小さい場合は履歴の最大値を使う（読み取りのみ・保存は発行時に行う）
  const mx=Math.max(fromCounter,...fromHistory,0);
  return`${prefix}-P${String(mx+1).padStart(3,"0")}`;
}
function getSubtotal(){const items=activeItems();return items.reduce((s,i)=>{const q=parseFloat(i.qty)||0;const p=hasQtyTiers(i)?resolveUnitPrice(i,i.qty):(parseFloat(i.price)||0);return s+q*p;},0);}
function activeItems(){
  const listItems=state.issue.items.filter(i=>i.qty&&parseFloat(i.qty)>0);
  const customItems=(state.issue.customItems||[]).filter(i=>i.name&&i.qty&&parseFloat(i.qty)>0);
  return [...listItems,...customItems.map(i=>({...i,code:i.code||"★"}))];
}
function buildInvoiceItems(){
  const items=activeItems().map(i=>({...i,price:hasQtyTiers(i)?resolveUnitPrice(i,i.qty):i.price}));
  if(isKanagawaRodoCustomer(state.issue.customer)&&state.issue.deliverySite){
    return[makeRodoSiteItem(state.issue.deliverySite),...items];
  }
  return items;
}
function getTotal(){const sub=getSubtotal();const mg=state.minG[state.issue.customer]||0;return Math.max(sub,mg);}

function selectCustomer(name){
  if(name==="__FREE__"){
    state.issue.freeCustomer=true;
    state.issue.customer="";
    state.issue.items=[];
    state.issue.useCustom=true;
    state.issue.customPanelOpen=true;
    const today=new Date();today.setDate(today.getDate()+1);
    state.issue.deliveryDate=toInput(today);
    render();
    setTimeout(()=>{const el=document.getElementById("free-customer-input");if(el)el.focus();},50);
    return;
  }
  state.issue.freeCustomer=false;
  state.issue.customer=name;
  state.issue.deliverySite=isKanagawaRodoCustomer(name)?(state.issue.deliverySite||KANAGAWA_RODO_SITES[0]):"";
  if(!name){state.issue.items=[];state.issue.deliveryDate="";state.issue.deliverySite="";render();return;}
  state.issue.deliveryDate=toInput(nextDelivery(name));
  const cp=state.prices.filter(p=>p.customer===name);
  state.issue.items=cp.map(p=>{
    const item={...p,qty:""};
    if(hasQtyTiers(p)){
      item.qtyTiers=p.qtyTiers.map(t=>({...t}));
      item.price=resolveUnitPrice(p,0);
    }
    return item;
  });
  state.issue.useCustom=cp.length===0;
  state.issue.customPanelOpen=cp.length===0;
  render();
  focusFirstQtyInput();
}

async function issueInvoice(){
  if(!state.issue.customer&&!state.issue.freeCustomer){showToast("客先を選択してください","error");return;}
  if(state.issue.freeCustomer&&!state.issue.customer.trim()){showToast("客先名を入力してください","error");return;}
  if(isKanagawaRodoCustomer(state.issue.customer)&&!state.issue.deliverySite){showToast("納品先を選択してください","error");return;}
  const items=buildInvoiceItems();
  if(!items.some(i=>!i.isDeliverySite&&i.qty&&parseFloat(i.qty)>0)){showToast("数量を入力してください","error");return;}
  const sub=getSubtotal();const mg=state.minG[state.issue.customer]||0;const total=Math.max(sub,mg);
  const invNoKey=state.issue.freeCustomer?"__FREE__":state.issue.customer;
  const inv={id:Date.now(),invoiceNo:nextInvoiceNo(invNoKey),customer:state.issue.customer,deliveryDate:state.issue.deliveryDate?fromInput(state.issue.deliveryDate):new Date(),issueDate:new Date(),items,subtotal:sub,minGuarantee:mg,total,memo:state.issue.memo||"",deliverySite:state.issue.deliverySite||"",issuedBy:window._userShortId||"",issuedByName:window._userDisplayName||""};
  state.history.unshift(inv);
  // 発行処理中フラグをON（onSnapshotによる上書きを防ぐ・カウンター保存より前に立てる）
  window._issuingInvoice = true;
  // 発行番号をcountersに保存（履歴削除後も番号を引き継ぐため）
  const invPrefix=inv.invoiceNo.split("-")[0];
  const invNum=parseInt((inv.invoiceNo.split("-P")[1])||0);
  if(!state.invoiceCounters[invPrefix]||state.invoiceCounters[invPrefix]<invNum){
    state.invoiceCounters[invPrefix]=invNum;
    save("pv_invoice_counters",state.invoiceCounters);
    if(window._fsSave)window._fsSave("pv_invoice_counters",state.invoiceCounters);
  }
  showToast("保存中...");
  let saveFailed = false;
  try{
    await window._fsSave("pv_history", state.history);
  }catch(e){
    console.error("履歴保存エラー",e);
    saveFailed = true;
    showToast("⚠️ 履歴の保存に失敗しました。ネットワークを確認してください。","error");
  }
  try{localStorage.setItem("pv_history",JSON.stringify(state.history));}catch{}
  // 3ヶ月より古い履歴を保存完了後に削除（保存失敗時はスキップ）
  if(!saveFailed){
    const threeMonthsAgo=new Date();threeMonthsAgo.setMonth(threeMonthsAgo.getMonth()-3);
    state.history=state.history.filter(h=>new Date(h.issueDate)>=threeMonthsAgo);
  }
  // フラグをOFF（少し遅延させてonSnapshotの発火を確実に避ける）
  setTimeout(()=>{ window._issuingInvoice = false; }, 2000);
  // 発行ログを別コレクションに保存（履歴が消えても残る）
  try{
    const {addDoc,collection}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    await addDoc(collection(window._db,"pvInvoiceLogs"),{
      invoiceNo:inv.invoiceNo,
      customer:inv.customer,
      total:inv.total,
      issuedBy:inv.issuedBy||"",
      issuedByName:inv.issuedByName||"",
      deliveryDate:inv.deliveryDate instanceof Date?inv.deliveryDate.toISOString():inv.deliveryDate,
      issuedAt:new Date().toISOString()
    });
  }catch(e){console.warn("発行ログ保存エラー",e);}
  state.issue.freeCustomer=false;state.issue.memo="";
  // 数量をリセット（前回の入力が残らないように）
  state.issue.items=state.issue.items.map(i=>({...i,qty:""}));
  state.issue.customItems=[{name:"",qty:"",price:""}];
  state.issue.customPanelOpen=false;
  state.printInvoice=inv;render();renderPrintModal(true);
}

async function toggleInvoiceLog(){
  _invoiceLogVisible = !_invoiceLogVisible;
  const section = document.getElementById("invoice-log-section");
  const btn = document.getElementById("invoice-log-btn");
  if(!section) return;
  if(!_invoiceLogVisible){
    section.style.display = "none";
    if(btn) btn.textContent = "📋 発行ログを見る";
    return;
  }
  if(btn) btn.textContent = "📋 発行ログを閉じる";
  section.style.display = "block";
  section.innerHTML = '<div class="card"><div style="text-align:center;color:#aaa;padding:20px">読み込み中...</div></div>';
  try{
    const {getDocs,collection,query,orderBy,limit} = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const q = query(collection(window._db,"pvInvoiceLogs"), orderBy("issuedAt","desc"), limit(200));
    const snap = await getDocs(q);
    const logs = snap.docs.map(d=>d.data());
    const rows = logs.map(l=>`<tr>
      <td style="font-size:12px">${l.issuedAt?new Date(l.issuedAt).toLocaleString("ja-JP"):""}</td>
      <td><span style="background:#e8f5e9;color:#2e7d32;padding:2px 10px;border-radius:12px;font-size:11px">${l.invoiceNo||""}</span></td>
      <td style="font-size:13px">${l.customer||""}</td>
      <td style="text-align:center"><span style="background:#e8d5b7;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700">${l.issuedBy||"—"}</span></td>
      <td style="text-align:right;font-size:13px">¥${(l.total||0).toLocaleString()}</td>
    </tr>`).join("");
    section.innerHTML = `<div class="card">
      <h3 style="margin-bottom:12px">📋 発行ログ（直近200件）</h3>
      <p style="font-size:12px;color:#888;margin-bottom:12px">履歴と照合して抜けがないか確認できます</p>
      <table><thead><tr>
        <th>発行日時</th><th>伝票番号</th><th>客先</th><th style="text-align:center;width:70px">発行者</th><th style="text-align:right">金額</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:#aaa;padding:20px">ログなし</td></tr>'}</tbody></table>
    </div>`;
  }catch(e){
    section.innerHTML = '<div class="card"><div style="color:#c62828">読み込みエラー：'+e.message+'</div></div>';
  }
}

async function toggleVoid(id){
  const h=state.history.find(x=>x.id===id);
  if(!h)return;
  const msg=h.void?"この伝票の没を解除しますか？":"この伝票を没にしますか？";
  if(!confirm(msg))return;
  h.void=!h.void;
  window._issuingInvoice=true;
  try{ await window._fsSave("pv_history",state.history); }catch(e){ console.error("没フラグ保存エラー",e); }
  try{ localStorage.setItem("pv_history",JSON.stringify(state.history)); }catch{}
  setTimeout(()=>{ window._issuingInvoice=false; },2000);
  render();
  showToast(h.void?"没にしました":"没を解除しました");
}

async function deleteHistory(id){
  if(!confirm("この履歴を削除しますか？"))return;
  state.history=state.history.filter(h=>h.id!==id);
  window._issuingInvoice=true;
  try{ await window._fsSave("pv_history",state.history); }catch(e){ console.error("履歴削除保存エラー",e); }
  try{ localStorage.setItem("pv_history",JSON.stringify(state.history)); }catch{}
  setTimeout(()=>{ window._issuingInvoice=false; },2000);
  showToast("削除しました");render();
}

function openCustomerDetail(id){
  const c=state.customers.find(x=>x.id===id);
  const custPrices=state.prices.filter(p=>p.customer===c.name);
  state.customerDetail={
    id,name:c.name,originalName:c.name,
    mg:state.minG[c.name]||0,
    cycle:DELIVERY_CYCLES[c.name]||"",
    closingDay:state.closingDays[c.name]!==undefined?state.closingDays[c.name]:"",
    skipHoliday:skipsHolidays(c.name),
    prices:custPrices.map(p=>({...p,qtyTiers:p.qtyTiers?p.qtyTiers.map(t=>({...t})):undefined})),
    newPriceMode:"fixed",
    newPriceTiers:DEFAULT_QTY_TIERS(),
  };
  render();
}

function toggleCycleDay(day){
  const d=state.customerDetail;
  if(d.cycle.includes(day)){d.cycle=d.cycle.replace(day,"");}
  else{
    const order=["月","火","水","木","金","土","日"];
    let c=d.cycle+day;
    d.cycle=order.filter(x=>c.includes(x)).join("");
  }
  render();
}

function setDetailNewCode(v){
  const p=state.products.find(x=>x.code===v);
  const nameEl=document.getElementById("dp-name");
  if(nameEl)nameEl.value=p?.name||"";
}
function setDetailNewPriceMode(mode){
  if(!state.customerDetail)return;
  state.customerDetail.newPriceMode=mode;
  if(mode==="tiered"){
    const priceEl=document.getElementById("dp-price");
    const base=priceEl?parseInt(priceEl.value)||0:0;
    if(!state.customerDetail.newPriceTiers||!state.customerDetail.newPriceTiers.length){
      state.customerDetail.newPriceTiers=[{min:1,max:null,price:base}];
    }
  }
  render();
}
function addDetailNewPriceTier(){
  if(!state.customerDetail.newPriceTiers)state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  const last=state.customerDetail.newPriceTiers[state.customerDetail.newPriceTiers.length-1];
  const nextMin=last?(last.max?last.max+1:(last.min+1)):1;
  state.customerDetail.newPriceTiers.push({min:nextMin,max:null,price:last?last.price:0});
  render();
}
function removeDetailNewPriceTier(ti){
  if(!state.customerDetail.newPriceTiers)return;
  state.customerDetail.newPriceTiers.splice(ti,1);
  if(!state.customerDetail.newPriceTiers.length)state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  render();
}

function toggleDetailPriceTier(i){
  const p=state.customerDetail.prices[i];
  if(hasQtyTiers(p)){
    delete p.qtyTiers;
    if(!p.price)p.price=0;
  }else{
    p.qtyTiers=[{min:1,max:null,price:p.price||0}];
    p.price=p.price||0;
  }
  render();
}
function addDetailPriceTier(i){
  const p=state.customerDetail.prices[i];
  if(!hasQtyTiers(p))p.qtyTiers=[];
  const last=p.qtyTiers[p.qtyTiers.length-1];
  const nextMin=last?(last.max?last.max+1:(last.min+1)):1;
  p.qtyTiers.push({min:nextMin,max:null,price:last?last.price:0});
  render();
}
function removeDetailPriceTier(i,ti){
  state.customerDetail.prices[i].qtyTiers.splice(ti,1);
  if(!state.customerDetail.prices[i].qtyTiers.length)delete state.customerDetail.prices[i].qtyTiers;
  render();
}

function addDetailPrice(){
  const code=document.getElementById("dp-code").value;
  const name=document.getElementById("dp-name").value;
  if(!code||!name){showToast("コードと品名を入力してください","error");return;}
  const mode=state.customerDetail.newPriceMode||"fixed";
  const row={customer:state.customerDetail.name,code,name,price:0};
  if(mode==="tiered"){
    const tiers=(state.customerDetail.newPriceTiers||[]).map(t=>({min:t.min??1,max:t.max==null?null:t.max,price:parseInt(t.price)||0}));
    if(!tiers.length){showToast("数量別単価を入力してください","error");return;}
    if(tiers.some(t=>!t.price&&t.price!==0)){showToast("各段階の単価を入力してください","error");return;}
    row.qtyTiers=tiers;
    row.price=tiers[0].price;
  }else{
    const price=parseInt(document.getElementById("dp-price")?.value)||0;
    row.price=price;
  }
  state.customerDetail.prices.push(row);
  state.customerDetail.newPriceMode="fixed";
  state.customerDetail.newPriceTiers=DEFAULT_QTY_TIERS();
  render();
}

function removeDetailPrice(i){
  state.customerDetail.prices.splice(i,1);render();
}

function saveCustomerDetail(){
  const d=state.customerDetail;
  if(!state.skipHolidays)state.skipHolidays={};

function b64ToAB(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const arr = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return buf;
}

// 締め日から対象期間を計算
// closingDay: 20/25/0(月末)
// baseYM: {year, month} = 締め日が含まれる月
// 戻り値: {from: Date, to: Date}
function getClosingPeriod(closingDay, baseYear, baseMonth) {
  let to, from;
  if (closingDay === 0) {
    // 月末締め: 当月1日〜当月末日
    to = new Date(baseYear, baseMonth, 0); // 月末
    from = new Date(baseYear, baseMonth - 1, 1);
  } else {
    // N日締め: 前月(N+1)日〜当月N日
    to = new Date(baseYear, baseMonth - 1, closingDay);
    from = new Date(baseYear, baseMonth - 2, closingDay + 1);
  }
  return { from, to };
}

function dateInRange(dateVal, from, to) {
  const d = new Date(dateVal);
  if (isNaN(d)) return false;
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const f = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const t = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  return dd >= f && dd <= t;
}

function resolveClosingDay(customer){
  const cd=state.closingDays[customer];
  return (cd!==undefined&&cd!=="")?cd:0;
}

function getBillingMonthFromDate(dateVal, closingDay){
  const d=new Date(dateVal);
  if(isNaN(d))return null;
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  if(!closingDay)return {year:y, month:m};
  if(day>closingDay){
    if(m===12)return {year:y+1, month:1};
    return {year:y, month:m+1};
  }
  return {year:y, month:m};
}

function sheetCustomerName(sheetLabel){
  return String(sheetLabel||"").replace(/\(\d+\)$/,"").replace(/_\d+年\d+月$/,"").trim();
}

function pendingBillingInvoices(){
  return (state.history||[]).filter(h=>!h.void&&!h.billingExportedAt);
}

function billingExportBtnHtml(){
  const n=pendingBillingInvoices().length;
  const badge=n?`<span style="background:#fff;color:#854f0b;border-radius:10px;padding:1px 7px;margin-left:6px;font-size:11px;font-weight:700">未反映: ${n}件</span>`:"";
  return `<button onclick="exportUnexportedExcel()" style="background:#854f0b;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap">📄 未反映→請求明細Excel${badge}</button>`;
}

// 伝票リスト（最大14枚）を1シートに書き込む
function fillSheet(wb, invoices, sheetLabel, yr, mo) {
  // テンプレートをコピー（スタイル・数式・結合を完全保持）
  const templateWb = XLSX.read(b64ToAB(BLANK_XLSX_B64), {type:"array", cellStyles:true});
  const templateWs = templateWb.Sheets[templateWb.SheetNames[0]];
  const ws = JSON.parse(JSON.stringify(templateWs));

  // セルに値をセットするヘルパー（既存スタイルを保持しつつ値だけ更新）
  function setCell(addr, type, value) {
    if (!ws[addr]) ws[addr] = {};
    ws[addr].t = type;
    ws[addr].v = value;
    if (type === "n" && typeof value === "string" && value.startsWith("=")) {
      ws[addr].t = "n";
      ws[addr].f = value.slice(1);
      ws[addr].v = 0;
    }
  }

  // ── ヘッダー部分 ──
  // A5: 客先名（A5:F5結合セル）
  setCell("A5", "s", sheetCustomerName(sheetLabel));
  // O3: 年（数字）, Q3: 月（数字）
  setCell("O3", "n", yr);
  setCell("Q3", "n", mo);
  // A9: 締め日表示（客先の締め日に合わせて自動表示）
  const closingDay = state.closingDays[sheetCustomerName(sheetLabel)];
  const shimeLbl = (closingDay === 0) ? "月末〆" : (closingDay ? closingDay + "日〆" : "25日〆");
  setCell("A9", "s", shimeLbl);

  const colLetters = ["C","D","E","F","G","H","I","J","K","L","M","N","O","P"];

  // ── 行10: 伝票番号 / 行11: 納品日 ──
  invoices.forEach((inv, i) => {
    if (i >= 14) return;
    const col = colLetters[i];
    setCell(col + "10", "s", inv.invoiceNo || "");
    const d = new Date(inv.deliveryDate);
    // 納品日をM/D形式で表示（例: 5/2）
    const mdDate = isNaN(d) ? "" : (d.getMonth()+1) + "/" + d.getDate();
    setCell(col + "11", "s", mdDate);
  });

  // ── 品名の収集（登場順を保持）──
  const productOrder = [];
  const productSet = new Set();
  invoices.forEach(inv => {
    (inv.items || []).forEach(it => {
      if (it.name && !productSet.has(it.name)) {
        productOrder.push(it.name);
        productSet.add(it.name);
      }
    });
  });

  // 単価マップ（最後に登場した値を使用）
  const priceMap = {};
  invoices.forEach(inv => {
    (inv.items || []).forEach(it => { if (it.name) priceMap[it.name] = it.price || 0; });
  });

  // ── 行12〜: 品名・単価・数量 ──
  productOrder.forEach((pname, rowIdx) => {
    const excelRow = 12 + rowIdx;
    setCell("A" + excelRow, "s", pname);
    setCell("B" + excelRow, "n", priceMap[pname] || 0);

    // C〜P列: 各伝票の数量
    invoices.forEach((inv, invIdx) => {
      if (invIdx >= 14) return;
      const item = (inv.items || []).find(it => it.name === pname);
      const qty = item ? (parseFloat(item.qty) || 0) : 0;
      if (qty > 0) setCell(colLetters[invIdx] + excelRow, "n", qty);
    });
    // Q・R列の数式はテンプレート既存のものをそのまま使用（上書きしない）
  });

  // !ref を更新（最大44行 or データ行数に合わせる）
  ws["!ref"] = "A1:R" + Math.max(44, 11 + productOrder.length);

  const safeLabel = sheetLabel.substring(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, safeLabel);
}

// 客先+伝票リストからワークブックにシートを追加（14枚超えで自動分割）
function appendSheetsForCustomer(wb, customer, invoices, yr, mo) {
  const pageSize = 14;
  const pages = Math.max(1, Math.ceil(invoices.length / pageSize));
  const ym = `_${yr}年${mo}月`;
  const extra = pages > 1 ? String(pages).length + 2 : 0;
  const raw = String(customer || "").replace(/[\/\\:*?\[\]]/g, "");
  const baseName = raw.substring(0, Math.max(1, 31 - ym.length - extra)) + ym;
  for (let p = 0; p < pages; p++) {
    const chunk = invoices.slice(p * pageSize, (p + 1) * pageSize);
    const label = pages > 1 ? baseName + `(${p+1})` : baseName;
    fillSheet(wb, chunk, label, yr, mo);
  }
}

// 未反映の伝票を請求月シートにまとめて書き出し（プリームスと同じ運用）
async function exportUnexportedExcel(){
  const toMark=pendingBillingInvoices();
  if(!toMark.length){showToast("未反映の伝票がありません","error");return;}
  const sheetMap=new Map();
  toMark.forEach(h=>{
    const cd=resolveClosingDay(h.customer);
    const bm=getBillingMonthFromDate(h.deliveryDate,cd);
    if(!bm)return;
    const customer=h.customer||"（客先不明）";
    const key=customer+"\0"+bm.year+"\0"+bm.month;
    if(!sheetMap.has(key))sheetMap.set(key,{customer,year:bm.year,month:bm.month,closingDay:cd});
  });
  const wb=XLSX.utils.book_new();
  let totalSheets=0;
  sheetMap.forEach(({customer,year,month,closingDay})=>{
    const {from,to}=getClosingPeriod(closingDay,year,month);
    const invoices=state.history.filter(h=>!h.void&&h.customer===customer&&dateInRange(h.deliveryDate,from,to));
    invoices.sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));
    if(!invoices.length)return;
    appendSheetsForCustomer(wb,customer,invoices,year,month);
    totalSheets++;
  });
  if(!totalSheets){showToast("該当期間に発行履歴がありません","error");return;}
  const d=new Date();
  const fname=`請求明細書_${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日.xlsx`;
  XLSX.writeFile(wb,fname);
  const now=new Date().toISOString();
  toMark.forEach(h=>{h.billingExportedAt=now;});
  try{localStorage.setItem("pv_history",JSON.stringify(state.history));}catch{}
  try{
    if(window._fsSave)await window._fsSave("pv_history",state.history);
  }catch(e){
    console.error("反映済み保存エラー",e);
    showToast("Excelは出力しましたが、反映済みの保存に失敗しました","error");
    render();
    return;
  }
  showToast(`${fname} をダウンロードしました（${totalSheets}客先）`);
  render();
}

// 今日の発行分を書き出し
function exportTodayExcel() {
  const todayStr = fmtDate(new Date());
  const filtered = state.history.filter(h => fmtDate(new Date(h.deliveryDate)) === todayStr);
  if (filtered.length === 0) { showToast("今日の発行履歴がありません", "error"); return; }
  const d = new Date();
  const yr = d.getFullYear(), mo = d.getMonth() + 1;
  const byCustomer = {};
  filtered.forEach(h => {
    const c = h.customer || "（客先不明）";
    if (!byCustomer[c]) byCustomer[c] = [];
    byCustomer[c].push(h);
  });
  const wb = XLSX.utils.book_new();
  Object.keys(byCustomer).forEach(c => appendSheetsForCustomer(wb, c, byCustomer[c], yr, mo));
  const fname = `請求明細書_${yr}年${mo}月${d.getDate()}日.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast(`${fname} をダウンロードしました`);
}

// 締め日期間で書き出し
function exportClosingExcel() {
  const custEl = document.getElementById("export-cust");
  const monthEl = document.getElementById("export-month");
  if (!monthEl || !monthEl.value) { showToast("年月を選択してください", "error"); return; }
  const [yrStr, moStr] = monthEl.value.split("-");
  const baseYear = parseInt(yrStr), baseMonth = parseInt(moStr);
  const selCust = custEl ? custEl.value : "";

  // 対象客先を絞り込む
  let targets = state.customers.filter(c => state.closingDays[c.name] !== undefined && state.closingDays[c.name] !== "");
  if (selCust) targets = targets.filter(c => c.name === selCust);
  if (targets.length === 0) { showToast("締め日が設定された客先がありません", "error"); return; }

  const wb = XLSX.utils.book_new();
  let totalSheets = 0;

  targets.forEach(cust => {
    const closingDay = state.closingDays[cust.name];
    const { from, to } = getClosingPeriod(closingDay, baseYear, baseMonth);
    const invoices = state.history.filter(h =>
      h.customer === cust.name && dateInRange(h.deliveryDate, from, to)
    );
    if (invoices.length === 0) return;
    // 日付順にソート
    invoices.sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate));
    appendSheetsForCustomer(wb, cust.name, invoices, baseYear, baseMonth);
    totalSheets++;
  });

  if (totalSheets === 0) { showToast("該当期間に発行履歴がありません", "error"); return; }
  const fname = `請求明細書_${baseYear}年${baseMonth}月締め.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast(`${fname} をダウンロードしました（${totalSheets}客先）`);
}


// 明細書Excel用JSONを書き出す
// 締め日ごとに客先別・期間別で集計したデータを出力
function exportMeisaiJson() {
  const today = new Date();
  const todayDay = today.getDate();

  // 客先ごとに「どの請求月に属するか」を自動判定して集計
  const meisaiData = [];

  state.customers.forEach(cust => {
    const closingDay = state.closingDays[cust.name];

    // 締め日から請求対象期間を計算
    // 締め日未設定 → 当月1日〜末日
    let from, to, billingYear, billingMonth;
    const cd = (closingDay !== undefined && closingDay !== "") ? closingDay : 0;

    if (cd === 0) {
      // 月末締め: 当月1日〜当月末日
      billingYear  = today.getFullYear();
      billingMonth = today.getMonth() + 1;
      from = new Date(billingYear, billingMonth - 1, 1);
      to   = new Date(billingYear, billingMonth, 0);
    } else {
      // N日締め: 今日が締め日以前 → 当月締め期間 / 締め日を過ぎた → 翌月締め期間
      if (todayDay <= cd) {
        // 当月締め期間: 前月(cd+1)日 〜 今月cd日
        billingYear  = today.getFullYear();
        billingMonth = today.getMonth() + 1;
      } else {
        // 翌月締め期間: 今月(cd+1)日 〜 来月cd日
        const next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        billingYear  = next.getFullYear();
        billingMonth = next.getMonth() + 1;
      }
      from = new Date(billingYear, billingMonth - 2, cd + 1);
      to   = new Date(billingYear, billingMonth - 1, cd);
    }

    const invoices = state.history.filter(h =>
      h.customer === cust.name && dateInRange(h.deliveryDate, from, to)
    );
    if (invoices.length === 0) return;

    invoices.sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate));

    // シート名: 客先名_YYYY年M月
    const sheetName = cust.name + "_" + billingYear + "年" + billingMonth + "月";

    meisaiData.push({
      customer:    cust.name,
      sheetName:   sheetName,
      year:        billingYear,
      month:       billingMonth,
      closingDay:  cd,
      periodFrom:  fmtDate(from),
      periodTo:    fmtDate(to),
      invoices: invoices.map(inv => ({
        invoiceNo:    inv.invoiceNo || "",
        deliveryDate: fmtDate(new Date(inv.deliveryDate)),
        items: (inv.items || []).map(it => ({
          name:  it.name  || "",
          price: it.price || 0,
          qty:   parseFloat(it.qty) || 0
        })).filter(it => it.name && it.qty > 0)
      }))
    });
  });

  if (meisaiData.length === 0) {
    showToast("現在の締め期間に発行履歴がありません", "error");
    return;
  }

  const output = {
    exportDate: new Date().toISOString(),
    meisaiData
  };

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `明細書データ_${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日.json`;
  a.click();

  // 書き出し内容のサマリーをトーストで表示
  const summary = meisaiData.map(d => d.sheetName + "（" + d.invoices.length + "件）").join("、");
  showToast("書き出し完了：" + summary);
}

const _guideOpen=new Set(); // 初期はすべて折りたたみ
let _guideUserUnlocked=false;

function toggleGuideSection(id,needsAdmin){
  if(_guideOpen.has(id)){
    _guideOpen.delete(id);
    render();
    return;
  }
  if(needsAdmin&&!_guideUserUnlocked){
    const pass=prompt("管理者パスワードを入力してください");
    if(pass===null)return;
    if(pass!==_userTabAdminPass){alert("パスワードが違います");return;}
    _guideUserUnlocked=true;
  }
  _guideOpen.add(id);
  render();
}

function downloadCSV(inv){
  if(!inv)return;
  var BOM="\uFEFF";
  var header=["納品日","客先名","品名","数量","単価","金額","合計金額","備考"];
  var rows=inv.items.map(function(item,i){
    return [
      fmtDate(inv.deliveryDate),
      inv.customer,
      item.name,
      item.qty,
      item.price,
      parseInt(item.qty)*item.price,
      i===0?inv.total:"",
      i===0?(inv.memo||""):""
    ];
  });
  function esc(v){
    var s=String(v!==null&&v!==undefined?v:"");
    return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  var lines=[header].concat(rows).map(function(r){return r.map(esc).join(",");});
  var csv=BOM+lines.join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  var d=fmtDate(inv.deliveryDate).replace(/\//g,"");
  a.href=url;
  a.download="納品書_"+inv.invoiceNo+"_"+d+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSVをダウンロードしました");
}
function doPrint(){
  const pa=document.getElementById("print-area");
  if(!pa)return;
  const inner=pa.innerHTML;
  const css=''
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'@page{size:257mm 168mm landscape;margin:0}'
    +'html,body{margin:0;padding:0;width:257mm;height:168mm;overflow:hidden;background:#fff;-webkit-print-color-adjust:exact;font-family:"MS Mincho",serif}'
    +'.wrap{position:absolute;top:0;left:0;width:257mm;height:168mm;overflow:hidden}'
    +'.inner{position:absolute;top:0;left:0;width:257mm;height:168mm;transform:translate(10.3mm,9.7mm) scale(0.92);transform-origin:top left;display:flex}'
    +'.slot{flex:1;min-width:0;max-width:calc(50% - 10px);padding:1mm 3mm}'
    +'.dv{flex:0 0 39px;width:39px;display:flex;align-items:center;justify-content:center}'
    +'table{table-layout:fixed;width:100%;border-collapse:collapse}'
    +'tbody tr{height:9mm}'
    +'thead th{padding:2px 4px}';
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'+css+'</style></head>'
    +'<body><div class="wrap"><div class="inner">'+inner+'</div></div></body></html>';
  const ifr=document.createElement("iframe");
  ifr.style.cssText="position:fixed;top:-9999px;left:-9999px;width:257mm;height:168mm;border:none;";
  document.body.appendChild(ifr);
  const doc=ifr.contentDocument||ifr.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  setTimeout(function(){
    ifr.contentWindow.focus();
    ifr.contentWindow.onafterprint=function(){
      document.body.removeChild(ifr);
      closePrint();
    };
    ifr.contentWindow.print();
    setTimeout(function(){if(document.body.contains(ifr))document.body.removeChild(ifr);},3000);
  },600);
}

function getUnissuedAlerts(){
  const today=new Date();
  const isSunday=d=>d.getDay()===0;
  // 前の稼働日（日曜は完全休みなのでスキップ）
  const prevDay=new Date(today);
  do{prevDay.setDate(prevDay.getDate()-1);}while(isSunday(prevDay));
  // 次の稼働日（日曜は完全休みなのでスキップ）
  const nextDay=new Date(today);
  do{nextDay.setDate(nextDay.getDate()+1);}while(isSunday(nextDay));
  // 対象は「前の稼働日・本日・次の稼働日」。本日が日曜なら本日は除外
  const targets=[prevDay];
  if(!isSunday(today))targets.push(today);
  targets.push(nextDay);
  const result=[];
  state.customers.forEach(c=>{
    const cycle=getCycleForCustomer(c.name);
    if(!cycle)return;
    targets.forEach(dt=>{
      if(isSunday(dt))return; // 日曜はカウントしない
      if(!isDeliveryDay(c.name,dt))return;
      // この日付に発行済みか確認
      const dateStr=toInput(dt);
      if(isUnissuedNone(c.name,dateStr))return;
      const issued=state.history.some(h=>{
        if(h.void)return false;
        if(h.customer!==c.name)return false;
        const hDate=toInput(h.deliveryDate instanceof Date?h.deliveryDate:new Date(h.deliveryDate));
        return hDate===dateStr;
      });
      if(!issued){
        const todayStr=toInput(today);
        const label=dateStr===todayStr?"本日":dateStr<todayStr?"昨日":"明日";
        result.push({customer:c.name,date:dt,dateStr,label,dayName:DAY_NAMES[dt.getDay()]});
      }
    });
  });
  const seen=new Set();
  return result.filter(r=>{
    const key=r.customer+r.dateStr;
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
}

function unissuedNoneKey(customer,dateStr){return customer+"\t"+dateStr;}
function isUnissuedNone(customer,dateStr){
  if(!state.unissuedNone)return false;
  return !!state.unissuedNone[unissuedNoneKey(customer,dateStr)];
}
function pruneUnissuedNone(){
  if(!state.unissuedNone)return;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-14);
  const cut=toInput(cutoff);
  Object.keys(state.unissuedNone).forEach(k=>{
    const dateStr=k.split("\t")[1]||"";
    if(dateStr&&dateStr<cut)delete state.unissuedNone[k];
  });
}
function markUnissuedNone(customer,dateStr){
  try{
    if(!customer||!dateStr){showToast("客先または日付が不正です","error");return;}
    const dateLabel=fmtDate(fromInput(dateStr)||dateStr);
    if(!confirm(`${customer}\n納品日 ${dateLabel} を「発行なし」にしますか？\n未発行一覧から外れます。`))return;
    if(!state.unissuedNone)state.unissuedNone={};
    state.unissuedNone[unissuedNoneKey(customer,dateStr)]=true;
    pruneUnissuedNone();
    save("pv_unissued_none",state.unissuedNone);
    if(window._fsSave)window._fsSave("pv_unissued_none",state.unissuedNone).catch(e=>console.warn("unissuedNone save",e));
    showToast("発行なしにしました");
    render();
  }catch(e){
    console.error("markUnissuedNone",e);
    alert("発行なしの処理でエラー："+(e.message||e));
  }
}
window.markUnissuedNone=markUnissuedNone;

function selectCustomerFromSidebar(customerName,dateStr){
  state.issue.freeCustomer=false;
  state.issue.customer=customerName;
  state.issue.deliveryDate=dateStr||toInput(nextDelivery(customerName));
  state.issue.deliverySite=isKanagawaRodoCustomer(customerName)?(state.issue.deliverySite||KANAGAWA_RODO_SITES[0]):"";
  const cp=state.prices.filter(p=>p.customer===customerName);
  state.issue.items=cp.map(p=>{
    const item={...p,qty:""};
    if(hasQtyTiers(p)){
      item.qtyTiers=p.qtyTiers.map(t=>({...t}));
      item.price=resolveUnitPrice(p,0);
    }
    return item;
  });
  state.issue.useCustom=cp.length===0;
  state.issue.customPanelOpen=cp.length===0;
  state.tab=0;
  render();
  focusFirstQtyInput();
}

  document.getElementById("print-modal").onclick=e=>{if(e.target===document.getElementById("print-modal"))closePrint();};
  window.onbeforeunload=function(e){
    if(window._currentUser){
      e.preventDefault();
      e.returnValue="";
      return "";

// ===== 認証・ユーザー管理 =====
function showLoginScreen(){
  document.getElementById("login-screen").classList.remove("hidden");
  document.querySelector(".header").style.display="none";
  const appLayout=document.getElementById("app-layout");
  if(appLayout)appLayout.style.display="none";
}
window.showLoginScreen=showLoginScreen;
function hideLoginScreen(){
  document.getElementById("login-screen").classList.add("hidden");
  document.querySelector(".header").style.display="";
  const appLayout=document.getElementById("app-layout");
  if(appLayout)appLayout.style.display="";
}
window.hideLoginScreen=hideLoginScreen;

function setUserProfile(prof,email){
  window._userShortId=prof?.shortId||"";
  window._userDisplayName=prof?.displayName||(email||"").split("@")[0]||"";
  const hu=document.getElementById("header-user");
  if(hu)hu.textContent=(window._userShortId?`[${window._userShortId}] `:"")+window._userDisplayName;
}

async function restoreUserProfileFromSession(){
  const user=window._currentUser;
  if(!user)return;
  let retries=0;
  while(typeof window._getUserProfiles!=="function"&&retries<20){
    await new Promise(r=>setTimeout(r,200));
    retries++;
  }
  const profiles=await window._getUserProfiles().catch(()=>[]);
  const prof=profiles.find(p=>p.uid===user.uid);
  setUserProfile(prof,user.email||"");
}

async function bootApp(){
  if(window._appStarted||window._booting)return;
  window._booting=true;
  try{
    if(window._startFirestoreSync)await window._startFirestoreSync();
    await restoreUserProfileFromSession();
    if(typeof window._appStart==="function")await window._appStart();
    window._appStarted=true;
    hideLoginScreen();
    // ログイン画面を閉じたあと、左サイドバーの未発行表示を確実に更新
    updateUnissuedAlerts();
  }catch(e){
    console.error("bootApp error",e);
    window._appStarted=false;
    const errEl=document.getElementById("login-error");
    if(errEl){
      errEl.style.color="#c62828";
      errEl.textContent="起動エラー："+(e.message||"不明なエラー");
    }
    showLoginScreen();
  }finally{
    window._booting=false;
  }
}
window.bootApp=bootApp;

async function doLogin(){
  const password=document.getElementById("login-password").value;
  const errEl=document.getElementById("login-error");
  errEl.textContent="";
  errEl.style.color="#c62828";
  if(!password){errEl.textContent="パスワードを入力してください";return;}
  window._manualLoginInProgress=true;
  try{
    let retries=0;
    while(typeof window._getUserProfiles!=="function"&&retries<20){
      await new Promise(r=>setTimeout(r,200));
      retries++;
    }
    const profiles=await window._getUserProfiles().catch(()=>[]);
    if(!profiles||profiles.length===0){
      errEl.textContent="ユーザー情報を取得できません。しばらく待ってから再試行してください。";
      return;
    }
    // 前回成功した略称IDを先に試し、不要な失敗回数を減らす
    let ordered=[...profiles];
    try{
      const last=(localStorage.getItem("pv_last_shortid")||"").toUpperCase();
      if(last){
        ordered.sort((a,b)=>{
          const as=(a.shortId||"").toUpperCase()===last?0:1;
          const bs=(b.shortId||"").toUpperCase()===last?0:1;
          return as-bs;
        });
      }
    }catch{}
    let loggedIn=false;
    let rateLimited=false;
    for(const prof of ordered){
      if(rateLimited)break;
      const email=prof.email||(prof.shortId
        ? prof.shortId.toLowerCase()+"@pv.local"
        : "");
      if(!email) continue;
      try{
        const cred=await window._signIn(email,password);
        const user=cred.user;
        setUserProfile(prof,email);
        try{if(prof.shortId)localStorage.setItem("pv_last_shortid",String(prof.shortId).toUpperCase());}catch{}
        if(prof.shortId!=="AD") await window._saveLoginLog(user.uid,email,window._userDisplayName);
        loggedIn=true;
        break;
      }catch(e){
        if(e.code==="auth/too-many-requests"){
          errEl.textContent="ログイン試行が多すぎます。しばらく待ってから再試行してください。";
          rateLimited=true;
          break;
        }
        continue;
      }
    }
    if(!loggedIn&&!rateLimited){errEl.textContent="パスワードが正しくありません";}
    else if(loggedIn)await bootApp();
  }catch(e){
    console.error("Login error:",e.code,e.message);
    errEl.textContent="エラー："+(e.code||e.message||"不明なエラー");
  }finally{
    window._manualLoginInProgress=false;
  }
}
async function doLogout(){
  if(!confirm("ログアウトしますか？"))return;
  await window._signOut();
  window._appStarted=false;
  window._booting=false;
  window._manualLoginInProgress=false;
  window._userShortId="";
  window._userDisplayName="";
  showLoginScreen();
}

async function addNewUser(){
  const pass=document.getElementById("new-user-pass").value;
  const shortId=document.getElementById("new-user-short").value.trim().toUpperCase();
  const displayName=document.getElementById("new-user-name").value.trim();
  const errEl=document.getElementById("new-user-err");
  errEl.textContent="";
  if(!pass||!shortId||!displayName){errEl.textContent="すべての項目を入力してください";return;}
  // メールアドレスはshortId@pv.localで自動生成
  const email=shortId.toLowerCase()+"@pv.local";
  try{
    const cred=await window._createUser(email,pass);
    await window._saveUserProfile(cred.user.uid,{email,shortId,displayName});
    errEl.style.color="#2e7d32";
    errEl.textContent="追加しました！";
    renderUserTabContent();
  }catch(e){
    errEl.style.color="#c62828";
    errEl.textContent="エラー："+e.message;
  }
}

async function deleteUserProfile(uid){
  if(!confirm("このユーザーのプロフィールを削除しますか？\n（Firebaseのアカウント自体はFirebaseコンソールから削除してください）"))return;
  try{
    const {deleteDoc,doc:fsDoc}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    await deleteDoc(fsDoc(window._db,"userProfiles",uid));
    renderUserTabContent();
  }catch(e){alert("削除エラー："+e.message);}
}

async function resetUserPasswordPrompt(uid,shortId,displayName){
  try{
    if(!shortId){alert("略称IDがありません");return;}
    const pass=prompt(`${displayName||shortId}（${shortId}）の新しいパスワードを入力してください`);
    if(pass===null)return;
    if(!pass||pass.length<6){alert("パスワードは6文字以上にしてください");return;}
    const pass2=prompt("確認のため、もう一度入力してください");
    if(pass2===null)return;
    if(pass!==pass2){alert("パスワードが一致しません");return;}
    await window._resetUserPassword(shortId,displayName,pass,uid);
    alert("パスワードを再設定しました。\n新しいパスワードだけでログインできます。");
    renderUserTabContent();
  }catch(e){
    console.error("resetUserPasswordPrompt",e);
    alert("再設定エラー："+(e.message||e.code||e));
  }
}
window.resetUserPasswordPrompt=resetUserPasswordPrompt;

async function checkDataTabPass(){
  const pass=document.getElementById("data-tab-pass").value;
  const errEl=document.getElementById("data-tab-err");
  errEl.textContent="";
  if(!pass){errEl.textContent="パスワードを入力してください";return;}
  const profiles=await window._getUserProfiles().catch(()=>[]);
  let matched=false;
  let rateLimited=false;
  for(const prof of profiles){
    if(rateLimited)break;
    const email=prof.email||(prof.shortId
      ? prof.shortId.toLowerCase()+"@pv.local"
      : "");
    if(!email) continue;
    try{
      await window._signIn(email,pass);
      matched=true;
      break;
    }catch(e){
      if(e.code==="auth/too-many-requests"){
        errEl.textContent="試行回数が多すぎます。しばらく待ってください。";
        rateLimited=true;
        break;
      }
      continue;
    }
  }
  if(matched){
    _dataTabUnlocked=true;
    renderDataTab();
  }else if(!rateLimited){
    errEl.textContent="パスワードが違います";
  }
}

  }catch(e){

async function uploadToGitHub(){
  const fileInput=document.getElementById("github-upload-file");
  const msgEl=document.getElementById("github-upload-msg");
  const btn=document.getElementById("github-upload-btn");
  if(!fileInput||!fileInput.files||fileInput.files.length===0){
    if(msgEl)msgEl.innerHTML='<span style="color:#c62828">ファイルを選択してください</span>';
    return;
  }
  if(msgEl)msgEl.innerHTML='<span style="color:#888">アップロード中...</span>';
  if(btn)btn.disabled=true;
  try{
    const htmlContent=await fileInput.files[0].text();
    const result=await window._autoUploadToGitHub(htmlContent);
    if(result){
      if(msgEl)msgEl.innerHTML='<span style="color:#2e7d32">✅ アップロード完了！数分後に全PCに反映されます。</span>';
    }else{
      if(msgEl)msgEl.innerHTML='<span style="color:#c62828">❌ 失敗。GitHub PATを確認してください。</span>';
    }
  }catch(e){
    if(msgEl)msgEl.innerHTML='<span style="color:#c62828">❌ エラー: '+e.message+'</span>';
  }finally{
    if(btn)btn.disabled=false;
  }
}

window._autoUploadToGitHub = async function(htmlContent) {
  try{
    // FirestoreからPATを取得
    const patSnap = await window._fsLoad("pv_githubPAT");
    if(!patSnap){
      console.warn("GitHub PATが見つかりません");
      return false;
    }
    const pat = typeof patSnap === "string" ? patSnap : String(patSnap);
    const owner = "pv-dn";
    const repo = "pourvoussystem";
    const path = "index.html";
    const branch = "main";

    // 現在のファイルのSHAを取得（更新に必要）
    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      headers: {
        "Authorization": `token ${pat}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });
    if(!getRes.ok){
      console.error("GitHub GET error", getRes.status);
      return false;
    }
    const getJson = await getRes.json();
    const sha = getJson.sha;

    // ファイルをBase64エンコード
    const encoded = btoa(unescape(encodeURIComponent(htmlContent)));

    // GitHubにPUT
    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${pat}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `自動更新 ${new Date().toLocaleString("ja-JP")}`,
        content: encoded,
        sha: sha,
        branch: branch
      })
    });

    if(putRes.ok){
      console.log("GitHub自動アップロード成功");
      return true;
    } else {
      console.error("GitHub PUT error", putRes.status);
      return false;
    }
  }catch(e){
    console.error("GitHub自動アップロードエラー", e);
    return false;
  }
};

// ===== 売上統計タブ =====
let _statsView="monthly";
let _statsYear=new Date().getFullYear();
let _statsRankMonth=null; // null=全年, 0〜11=その月
let _statsCharts={};

function getValidHistory(){
  return state.history.filter(h=>!h.void&&h.total>0);
}

function getAvailableYears(){
  const years=new Set();
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(!isNaN(d))years.add(d.getFullYear());
  });
  const arr=[...years].sort((a,b)=>b-a);
  if(arr.length===0)arr.push(new Date().getFullYear());
  return arr;
}

function aggregateMonthlyTotal(year){
  const months=Array(12).fill(0);
  const counts=Array(12).fill(0);
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    months[d.getMonth()]+=h.total;
    counts[d.getMonth()]++;
  });
  return{months,counts};
}

function aggregateMonthlyByCustomer(year){
  const map={};
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    const m=d.getMonth();
    if(!map[h.customer])map[h.customer]=Array(12).fill(0);
    map[h.customer][m]+=h.total;
  });
  return map;
}

function aggregateCustomerRanking(year,month){
  const map={};
  getValidHistory().forEach(h=>{
    const d=new Date(h.issueDate||h.deliveryDate);
    if(isNaN(d)||d.getFullYear()!==year)return;
    if(month!==null&&month!==undefined&&d.getMonth()!==month)return;
    map[h.customer]=(map[h.customer]||0)+h.total;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function aggregateYTDCumulative(year){
  const data=aggregateMonthlyTotal(year);
  const cumulative=[];
  let sum=0;
  const now=new Date();
  const currentMonth=(year===now.getFullYear())?now.getMonth():11;
  for(let i=0;i<=currentMonth;i++){
    sum+=data.months[i];
    cumulative.push(sum);
  }
  return cumulative;
}

function destroyCharts(){
  Object.values(_statsCharts).forEach(c=>{try{c.destroy();}catch{}});
  _statsCharts={};
}

function setStatsView(v){_statsView=v;render();}
function setStatsYear(y){_statsYear=parseInt(y);render();}
function setStatsRankMonth(m){
  _statsRankMonth=(m===null||m===""||m==="all")?null:parseInt(m);
  render();
}

const MONTH_LABELS=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const CHART_COLORS=["#1a1a2e","#e8d5b7","#2d6a4f","#c62828","#1565c0","#f57f17","#6a1b9a","#00838f","#e65100","#2e7d32","#ad1457","#4527a0","#00695c","#bf360c","#283593","#827717","#004d40","#880e4f","#1b5e20","#311b92"];

function renderStatsTab(){
  destroyCharts();
  const years=getAvailableYears();
  if(!years.includes(_statsYear))_statsYear=years[0];

  const viewBtns=[
    {id:"monthly",label:"月別全体"},
    {id:"byCustomer",label:"客先別"},
    {id:"ranking",label:"ランキング"},
    {id:"cumulative",label:"累計推移"},
    {id:"compare",label:"前年比較"}
  ];
  const viewNav=viewBtns.map(v=>`<button onclick="setStatsView('${v.id}')" style="padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:${_statsView===v.id?'600':'400'};background:${_statsView===v.id?'#1a1a2e':'#f0ede8'};color:${_statsView===v.id?'#e8d5b7':'#555'}">${v.label}</button>`).join("");
  const yearOpts=years.map(y=>`<option value="${y}"${y===_statsYear?" selected":""}>${y}年</option>`).join("");

  let content="";
  if(_statsView==="monthly")content=renderStatsMonthly();
  else if(_statsView==="byCustomer")content=renderStatsByCustomer();
  else if(_statsView==="ranking")content=renderStatsRanking();
  else if(_statsView==="cumulative")content=renderStatsCumulative();
  else if(_statsView==="compare")content=renderStatsCompare();

  const html=`<h2 style="font-size:20px;font-weight:600;margin-bottom:20px;color:#1a1a2e">📊 売上統計</h2>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select onchange="setStatsYear(this.value)" style="padding:7px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px">${yearOpts}</select>
        <div style="display:flex;gap:4px;flex-wrap:wrap">${viewNav}</div>
      </div>
    </div>
    ${content}`;
  setTimeout(()=>drawStatsCharts(),50);
  return html;
}

function renderStatsMonthly(){
  const data=aggregateMonthlyTotal(_statsYear);
  const yearTotal=data.months.reduce((s,v)=>s+v,0);
  const yearCount=data.counts.reduce((s,v)=>s+v,0);
  const rows=MONTH_LABELS.map((m,i)=>`<tr><td style="font-weight:600">${m}</td><td style="text-align:right">¥${data.months[i].toLocaleString()}</td><td style="text-align:right;color:#888">${data.counts[i]}件</td></tr>`).join("");
  return`<div class="card"><h3>月別売上（${_statsYear}年）</h3>
    <div style="height:300px;margin-bottom:20px"><canvas id="chart-monthly"></canvas></div>
    <table><thead><tr style="background:#f5f5f5;font-size:12px"><th style="padding:8px;text-align:left">月</th><th style="padding:8px;text-align:right">売上</th><th style="padding:8px;text-align:right">件数</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid #1a1a2e;font-weight:700"><td>合計</td><td style="text-align:right">¥${yearTotal.toLocaleString()}</td><td style="text-align:right;color:#888">${yearCount}件</td></tr></tfoot></table></div>`;
}

function renderStatsByCustomer(){
  const map=aggregateMonthlyByCustomer(_statsYear);
  const customers=Object.keys(map).sort((a,b)=>{
    const ta=map[a].reduce((s,v)=>s+v,0);
    const tb=map[b].reduce((s,v)=>s+v,0);
    return tb-ta;
  });
  if(customers.length===0)return`<div class="card"><p style="color:#888">データがありません</p></div>`;
  const rows=customers.map(c=>{
    const total=map[c].reduce((s,v)=>s+v,0);
    const cells=map[c].map(v=>`<td style="text-align:right;font-size:12px">${v>0?"¥"+v.toLocaleString():"—"}</td>`).join("");
    return`<tr><td style="font-weight:500;white-space:nowrap;font-size:12px">${c}</td>${cells}<td style="text-align:right;font-weight:700;font-size:12px">¥${total.toLocaleString()}</td></tr>`;
  }).join("");
  const monthHeaders=MONTH_LABELS.map(m=>`<th style="padding:6px 4px;text-align:right;font-size:11px">${m}</th>`).join("");
  const monthTotals=Array(12).fill(0);
  customers.forEach(c=>map[c].forEach((v,i)=>monthTotals[i]+=v));
  const totalCells=monthTotals.map(v=>`<td style="text-align:right;font-weight:700;font-size:12px">¥${v.toLocaleString()}</td>`).join("");
  const grandTotal=monthTotals.reduce((s,v)=>s+v,0);
  return`<div class="card"><h3>客先別月別売上（${_statsYear}年）</h3>
    <div style="height:350px;margin-bottom:20px"><canvas id="chart-bycustomer"></canvas></div>
    <div style="overflow-x:auto"><table><thead><tr style="background:#f5f5f5;font-size:11px"><th style="padding:6px;text-align:left">客先</th>${monthHeaders}<th style="padding:6px;text-align:right">合計</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid #1a1a2e"><td style="font-weight:700;font-size:12px">合計</td>${totalCells}<td style="text-align:right;font-weight:700;font-size:12px">¥${grandTotal.toLocaleString()}</td></tr></tfoot></table></div></div>`;
}

function renderStatsRanking(){
  const ranking=aggregateCustomerRanking(_statsYear,_statsRankMonth);
  const periodLabel=_statsRankMonth===null?`${_statsYear}年 通年`:`${_statsYear}年 ${MONTH_LABELS[_statsRankMonth]}`;
  const monthBtns=[{id:null,label:"通年"},...MONTH_LABELS.map((lab,i)=>({id:i,label:lab}))].map(m=>{
    const active=(_statsRankMonth===null&&m.id===null)||_statsRankMonth===m.id;
    return`<button type="button" onclick="setStatsRankMonth(${m.id===null?"null":m.id})" style="padding:5px 12px;border-radius:6px;border:1px solid ${active?"#1a1a2e":"#ddd"};cursor:pointer;font-size:12px;font-weight:${active?"600":"400"};background:${active?"#1a1a2e":"#fff"};color:${active?"#e8d5b7":"#555"}">${m.label}</button>`;
  }).join("");
  if(ranking.length===0)return`<div class="card"><h3>客先別売上ランキング（${periodLabel}）</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px">${monthBtns}</div>
    <p style="color:#888">データがありません</p></div>`;
  const total=ranking.reduce((s,r)=>s+r[1],0);
  const rows=ranking.map(([name,amount],i)=>{
    const pct=total>0?(amount/total*100).toFixed(1):"0";
    return`<tr><td style="font-weight:600;color:#888;text-align:center">${i+1}</td><td style="font-weight:500">${name}</td><td style="text-align:right;font-weight:600">¥${amount.toLocaleString()}</td><td style="text-align:right;color:#888">${pct}%</td></tr>`;
  }).join("");
  return`<div class="card"><h3>客先別売上ランキング（${periodLabel}）</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px">${monthBtns}</div>
    <div style="height:${Math.max(250,ranking.length*30+60)}px;margin-bottom:20px"><canvas id="chart-ranking"></canvas></div>
    <table><thead><tr style="background:#f5f5f5;font-size:12px"><th style="padding:8px;text-align:center">順位</th><th style="padding:8px;text-align:left">客先</th><th style="padding:8px;text-align:right">売上</th><th style="padding:8px;text-align:right">構成比</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid #1a1a2e;font-weight:700"><td></td><td>合計</td><td style="text-align:right">¥${total.toLocaleString()}</td><td style="text-align:right">100%</td></tr></tfoot></table></div>`;
}

function renderStatsCumulative(){
  const cumData=aggregateYTDCumulative(_statsYear);
  if(cumData.length===0)return`<div class="card"><p style="color:#888">データがありません</p></div>`;
  const prevYear=_statsYear-1;
  const prevCum=aggregateYTDCumulative(prevYear);
  const rows=cumData.map((v,i)=>{
    const prev=prevCum[i]!==undefined?prevCum[i]:null;
    const diff=prev!==null?v-prev:null;
    const diffStr=diff!==null?(diff>=0?"+":"")+"¥"+diff.toLocaleString():"—";
    const diffColor=diff===null?"#888":diff>=0?"#2d6a4f":"#c62828";
    return`<tr><td style="font-weight:600">${MONTH_LABELS[i]}</td><td style="text-align:right;font-weight:600">¥${v.toLocaleString()}</td><td style="text-align:right;color:#888">${prev!==null?"¥"+prev.toLocaleString():"—"}</td><td style="text-align:right;color:${diffColor};font-weight:600">${diffStr}</td></tr>`;
  }).join("");
  return`<div class="card"><h3>累計売上推移（${_statsYear}年 1月〜）</h3>
    <div style="height:300px;margin-bottom:20px"><canvas id="chart-cumulative"></canvas></div>
    <table><thead><tr style="background:#f5f5f5;font-size:12px"><th style="padding:8px;text-align:left">月</th><th style="padding:8px;text-align:right">${_statsYear}年 累計</th><th style="padding:8px;text-align:right">${prevYear}年 累計</th><th style="padding:8px;text-align:right">差額</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderStatsCompare(){
  const cur=aggregateMonthlyTotal(_statsYear);
  const prev=aggregateMonthlyTotal(_statsYear-1);
  const rows=MONTH_LABELS.map((m,i)=>{
    const c=cur.months[i];const p=prev.months[i];
    const diff=c-p;
    const pctStr=p>0?((c/p-1)*100).toFixed(1)+"%":"—";
    const diffColor=diff>=0?"#2d6a4f":"#c62828";
    return`<tr><td style="font-weight:600">${m}</td><td style="text-align:right">¥${c.toLocaleString()}</td><td style="text-align:right;color:#888">¥${p.toLocaleString()}</td><td style="text-align:right;color:${diffColor};font-weight:600">${(diff>=0?"+":"")+"¥"+diff.toLocaleString()}</td><td style="text-align:right;color:${diffColor}">${pctStr}</td></tr>`;
  }).join("");
  const curTotal=cur.months.reduce((s,v)=>s+v,0);
  const prevTotal=prev.months.reduce((s,v)=>s+v,0);
  const totalDiff=curTotal-prevTotal;
  const totalPct=prevTotal>0?((curTotal/prevTotal-1)*100).toFixed(1)+"%":"—";
  return`<div class="card"><h3>前年同月比較（${_statsYear}年 vs ${_statsYear-1}年）</h3>
    <div style="height:300px;margin-bottom:20px"><canvas id="chart-compare"></canvas></div>
    <table><thead><tr style="background:#f5f5f5;font-size:12px"><th style="padding:8px;text-align:left">月</th><th style="padding:8px;text-align:right">${_statsYear}年</th><th style="padding:8px;text-align:right">${_statsYear-1}年</th><th style="padding:8px;text-align:right">差額</th><th style="padding:8px;text-align:right">増減率</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid #1a1a2e;font-weight:700"><td>合計</td><td style="text-align:right">¥${curTotal.toLocaleString()}</td><td style="text-align:right;color:#888">¥${prevTotal.toLocaleString()}</td><td style="text-align:right;color:${totalDiff>=0?"#2d6a4f":"#c62828"}">${(totalDiff>=0?"+":"")+"¥"+totalDiff.toLocaleString()}</td><td style="text-align:right">${totalPct}</td></tr></tfoot></table></div>`;
}

function drawStatsCharts(){
  if(typeof Chart==="undefined")return;
  const yen={callback:v=>"¥"+v.toLocaleString()};

  if(_statsView==="monthly"){
    const el=document.getElementById("chart-monthly");if(!el)return;
    const data=aggregateMonthlyTotal(_statsYear);
    _statsCharts.monthly=new Chart(el,{type:"bar",data:{labels:MONTH_LABELS,datasets:[{label:"売上",data:data.months,backgroundColor:"#1a1a2e",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:yen,beginAtZero:true}}}});
  }
  else if(_statsView==="byCustomer"){
    const el=document.getElementById("chart-bycustomer");if(!el)return;
    const map=aggregateMonthlyByCustomer(_statsYear);
    const customers=Object.keys(map).sort((a,b)=>map[b].reduce((s,v)=>s+v,0)-map[a].reduce((s,v)=>s+v,0));
    const top=customers.slice(0,8);
    const datasets=top.map((c,i)=>({label:c,data:map[c],backgroundColor:CHART_COLORS[i%CHART_COLORS.length],borderRadius:2}));
    _statsCharts.byCustomer=new Chart(el,{type:"bar",data:{labels:MONTH_LABELS,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{x:{stacked:true},y:{stacked:true,ticks:yen,beginAtZero:true}}}});
  }
  else if(_statsView==="ranking"){
    const el=document.getElementById("chart-ranking");if(!el)return;
    const ranking=aggregateCustomerRanking(_statsYear,_statsRankMonth);
    if(ranking.length===0)return;
    const labels=ranking.map(r=>r[0]);
    const values=ranking.map(r=>r[1]);
    _statsCharts.ranking=new Chart(el,{type:"bar",data:{labels,datasets:[{label:"売上",data:values,backgroundColor:CHART_COLORS.slice(0,ranking.length),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:yen,beginAtZero:true}}}});
  }
  else if(_statsView==="cumulative"){
    const el=document.getElementById("chart-cumulative");if(!el)return;
    const cumData=aggregateYTDCumulative(_statsYear);
    const prevCum=aggregateYTDCumulative(_statsYear-1);
    const labels=MONTH_LABELS.slice(0,Math.max(cumData.length,prevCum.length));
    const datasets=[{label:_statsYear+"年",data:cumData,borderColor:"#1a1a2e",backgroundColor:"rgba(26,26,46,0.1)",fill:true,tension:0.3,pointRadius:4}];
    if(prevCum.length>0)datasets.push({label:(_statsYear-1)+"年",data:prevCum,borderColor:"#ccc",backgroundColor:"transparent",borderDash:[5,3],tension:0.3,pointRadius:3});
    _statsCharts.cumulative=new Chart(el,{type:"line",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{ticks:yen,beginAtZero:true}}}});
  }
  else if(_statsView==="compare"){
    const el=document.getElementById("chart-compare");if(!el)return;
    const cur=aggregateMonthlyTotal(_statsYear);
    const prev=aggregateMonthlyTotal(_statsYear-1);
    _statsCharts.compare=new Chart(el,{type:"bar",data:{labels:MONTH_LABELS,datasets:[{label:_statsYear+"年",data:cur.months,backgroundColor:"#1a1a2e",borderRadius:4},{label:(_statsYear-1)+"年",data:prev.months,backgroundColor:"#ddd",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{ticks:yen,beginAtZero:true}}}});
  }
}

  if(state.issue.deliverySite===undefined)state.issue.deliverySite="";
  render();
};
